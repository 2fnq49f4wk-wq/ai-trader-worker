# [V33.679] 앱 진화 3단계 준비 — Google Play 제출용 서명 AAB(+ 서명 APK). 수동 실행만.
# 필요한 GitHub 비밀값: ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
# (선택) GOOGLE_SERVICES_JSON — 앱 푸시. 키 저장소는 사용자 보관(잃으면 같은 앱으로 업데이트 불가 — Play 앱 서명 사용 권장).
name: Release Android App
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: 서명 비밀값 확인
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 비밀값이 없습니다 — app/README.md 의 '서명 키 만들기' 참고"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 의존성
        run: npm install --no-audit --no-fund
      - name: 안드로이드 프로젝트 준비
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./scripts-prepare.sh
      - name: 서명 빌드(AAB·APK)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KSP" \
            -Pandroid.injected.signing.key.alias="$KA" \
            -Pandroid.injected.signing.key.password="$KP"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: 결과물
        uses: actions/upload-artifact@v4
        with:
          name: lux-android-release
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
