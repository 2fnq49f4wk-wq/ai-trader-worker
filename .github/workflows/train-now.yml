name: Worker 학습기 수동 실행

# [V33.174] ★Modal 이 학습하지 않는 모델들을 손으로 돌릴 방법이 없었다.★
#
#   외부(Modal) 트레이너가 맡는 것: DNN · GBDT · XGB/LGB/CAT · FM · SCALP.
#   그런데 XALPHA · FLOW · STACK · MEMO 는 ★워커 안에서★ 도는 야간 로지스틱 회귀다
#   (modal_train.py 에 'xalpha' 라는 문자열조차 없다). 즉 Modal 워크플로를 아무리 돌려도
#   이 넷은 학습되지 않는다 — 그런데 그걸 알 방법도, 손으로 돌릴 방법도 없었다.
#
#   워커에는 이미 POST /api/ai/train-now?target=... 이 있다. 다만 TRAIN_KEY 인증이 필요하고
#   그 키는 wrangler secret 이라 GitHub 쪽에 없었다. 이 워크플로가 그 다리를 놓는다.
#
#   ※ 표본이 모자라면 학습기는 "표본 N/최소 — 학습 대기" 를 돌려준다. 그건 실패가 아니라
#     정상 응답이므로 아래 요약이 그대로 보여준다(초록불로 덮지 않는다).

on:
  workflow_dispatch:
    inputs:
      target:
        description: '학습기 (all = 야간 파이프라인 전 단계)'
        type: choice
        default: xalpha
        # [V33.179] dual(이중헤드 강세/약세)이 빠져 있었다 — 화면에서 '합류 보류' 로 가장 눈에 띄는
        #   위원인데 정작 손으로 돌릴 수가 없어, 고치고도 다음 야간까지 확인할 방법이 없었다.
        # [V33.205] stackbf(소급생성)가 빠져 있었다 — stack(학습기)만 있어서 "표본이 쌓이는지"를
        #   확인하려면 전체 파이프라인(13회차·8분)을 돌리는 수밖에 없었다. 재료와 학습은 다른 일이다.
        options: [xalpha, flow, stackbf, stack, memo, dual, mind, gbdt, dnn, l1, all]

concurrency:
  group: worker-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    name: 워커 학습기 실행
    steps:
      - uses: actions/checkout@v4

      # 주소는 스스로 알아낸다 — 사람이 붙여넣을 것을 늘리지 않는다(워치독과 같은 방식).
      - name: 워커 주소 확인
        id: url
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          NAME=$(grep -m1 '^name' wrangler.toml | sed 's/.*= *"//; s/"//')
          if [ -n "$WORKER_URL" ]; then
            echo "url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SUB=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("result") or {}).get("subdomain") or "")' 2>/dev/null)
          [ -n "$SUB" ] && echo "url=https://$NAME.$SUB.workers.dev" >> "$GITHUB_OUTPUT" || echo "url=" >> "$GITHUB_OUTPUT"

      # ★없으면 조용히 넘어가지 않고 실패시킨다.★ "아무 일도 안 했는데 초록불" 을 만들지 않는다.
      - name: 준비 확인
        env:
          TRAIN_KEY: ${{ secrets.TRAIN_KEY }}
        run: |
          FAIL=0
          if [ -z "${{ steps.url.outputs.url }}" ]; then
            echo "::error::워커 주소를 알아내지 못했다"
            echo "### 🔴 워커 주소 없음" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN 에 \`Workers Scripts: Read\` 권한을 주거나, Variables 에 \`WORKER_URL\` 을 등록하세요." >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          fi
          if [ -z "$TRAIN_KEY" ]; then
            echo "::error::TRAIN_KEY 시크릿 미설정"
            {
              echo "### 🔴 TRAIN_KEY 시크릿이 없다"
              echo ""
              echo "워커에 설정해 둔 것과 ★같은 값★ 을 GitHub 에도 등록해야 한다."
              echo "값이 기억나지 않으면 새로 정해 양쪽에 같이 넣으면 된다:"
              echo ""
              echo '```'
              echo "wrangler secret put TRAIN_KEY     # 워커 쪽"
              echo '```'
              echo "그리고 Settings → Secrets and variables → Actions → **Secrets** 에 \`TRAIN_KEY\` 로 같은 값 등록."
              echo "(Modal 쪽 시크릿에도 같은 값이 들어가 있어야 외부 학습이 계속 동작한다)"
            } >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          fi
          exit $FAIL

      - name: 학습 실행
        id: run
        env:
          TRAIN_KEY: ${{ secrets.TRAIN_KEY }}
          URL: ${{ steps.url.outputs.url }}
          TARGET: ${{ inputs.target }}
        run: |
          set +e
          : > trainlog.txt
          # ══ [V33.296] ★V33.293 이 만든 위험 — 단일 단계 이어부르기에 시간 상한이 없었다★
          #   종전 단일 단계는 1회차로 끝나서 --max-time 900 노출이 한 번이었다. 이어부르기를
          #   넣으면서 최악이 40회 × 900초 = ★10시간★ 이 됐다. 회차 수는 시간을 안 묶는다 —
          #   한 회차가 얼마나 걸릴지는 서버 사정이라 여기서 알 수가 없다. ★벽시계로 막는다.★
          #   빈 구간 메우기는 한 번에 다 끝낼 일이 아니다 — 남으면 다음 실행이 커서에서 이어 간다.
          #
          #   ※ [V33.297 정정] V33.296 커밋 메시지는 근거로 "이 실행이 80분을 넘겨도 40회차에
          #     안 닿았다" 를 적었다. ★틀렸다.★ 로그를 실제로 읽으니 회차당 24~30초로 정상이었고
          #     (회차 2~7: +1200~1800표본 · 22.2~30.3초), 실행은 04:49:29→04:54:16 약 5분 만에
          #     ★내 취소로★ 끝났다. 80분은 GitHub API 의 run/job status 가 stale 하게
          #     in_progress 를 계속 돌려준 것을 실행 시간으로 오독한 값이다.
          #     ★고침 자체는 유효하다★ — 상한 10시간은 코드에서 읽히는 사실이고 방어는 옳다.
          #     틀린 것은 근거였다. 이 저장소의 규율은 "추측이 아니라 측정" 인데, 측정하지 않은
          #     숫자를 측정한 것처럼 적었다.
          #   ★운영 교훈★: 실행 상태는 API 의 status 가 아니라 ★로그 타임스탬프★ 를 믿는다.
          #     이 세션에서 두 번(all·stackbf) 다 API 가 한 시간 넘게 stale 했다.
          LOOP_BUDGET=1500            # 25분. 이 시간을 넘기면 다음 회차를 시작하지 않는다.
          LOOP_T0=$(date +%s)
          FROM=""; ROUND=0; CODE=""; SOFT=0; SKIP=""; SKIPPED_ANY=0
          # [V33.192] ★target=all 은 한 번으로 안 끝난다 — 재개까지 돌려야 '전체'다.★
          #   워커는 1요청 CPU 상한(300s) 때문에 240초에서 스스로 끊고 남은 단계를
          #   skipped(deadline) 로 표기한 뒤 resume 경로를 돌려준다. 종전 워크플로는 그 값을
          #   쓰지 않고 한 번만 불렀다 — 그래서 파이프라인 ★뒷단이 매번 통째로 안 돌았다★.
          #   하필 확률 보정(calibrate)·자가평가(selfreview)·원장통계(portstats)가 그 자리에 있다.
          FINISHED=0
          while [ "$ROUND" -lt 40 ]; do
            # [V33.296] 회차 ★시작 전★ 에 예산을 본다 — 시작한 회차는 끝까지 두어야
            #   서버 커서가 어중간한 자리에 남지 않는다.
            if [ "$(( $(date +%s) - LOOP_T0 ))" -ge "$LOOP_BUDGET" ]; then
              echo "회차 예산 ${LOOP_BUDGET}초 소진 — 여기서 끊는다(서버 커서가 이어받는다)" | tee -a trainlog.txt
              break
            fi
            ROUND=$((ROUND+1))
            # [V33.195] 회차당 예산을 240초 → 150초로 줄인다. 마감시한은 ★단계 사이★ 에서만
            #   재므로, 240초를 다 쓴 뒤 또 무거운 단계를 시작하면 한 회차가 452초까지 간다(실측).
            #   짧게 끊으면 워커에 여유가 남아 다음 회차가 자원한도에 걸릴 확률이 준다.
            Q="target=$TARGET&deadlineMs=150000"
            # [V33.293] from= 은 all 의 재개지점이다. 단일 단계의 재개는 ★서버가 든 커서★ 가
            #   하므로 여기서 넘길 것이 없다 — 다시 부르기만 하면 이어서 돈다.
            [ -n "$FROM" ] && [ "$TARGET" = "all" ] && Q="$Q&from=$FROM"
            echo "POST $URL/api/ai/train-now?$Q"
            # [V33.296] 한 회차의 상한도 목표에 맞춘다. all 은 워커가 150초에서 스스로 끊고
            #   응답을 만드는 데 시간이 더 걸릴 수 있어 넉넉히 둔다. 단일 단계는 한 단계만
            #   도는 호출이라 900초를 기다릴 이유가 없다 — 그만큼 걸리면 그건 정상이 아니다.
            RT=900; [ "$TARGET" != "all" ] && RT=180
            BODY=$(curl -sS --max-time "$RT" -w '\n%{http_code}' -X POST \
              -H "X-Train-Key: $TRAIN_KEY" \
              "$URL/api/ai/train-now?$Q")
            CODE=$(printf '%s' "$BODY" | tail -n1)
            JSON=$(printf '%s' "$BODY" | sed '$d')
            printf '%s' "$JSON" > result.json
            # [V33.195] ★한 번의 503 이 스윕 전체를 끝내고 있었다.★ 실측: 회차1 이 452초를 쓰고
            #   200 으로 끝났는데(7단계 완료), 3초 뒤 회차2 가 503 을 받자 루프가 통째로 멈췄다.
            #   워커는 무거운 회차 직후 자원한도에 걸릴 수 있다 — 그건 ★일시적★ 이고, 남은 34단계를
            #   포기할 이유가 아니다. 재소급 스윕이 이미 쓰는 방식(연속 실패에만 중단)과 같게 만든다.
            if [ "$CODE" != "200" ]; then
              SOFT=$((SOFT+1))
              echo "회차 $ROUND: HTTP $CODE — ${SOFT}회 연속 (재개지점 ${FROM:-처음})" | tee -a trainlog.txt
              # [V33.196] ★같은 단계에서 계속 죽으면 그건 일시적 자원한도가 아니라 그 단계의 문제다.★
              #   실측: from=harvest 로 세 번 연속 503(각 45~70초). harvest 는 워커를 죽이는데,
              #   그 뒤에 있는 34단계(calibrate·portstats·selfreview 포함)는 ★한 번도 못 돌았다★.
              #   워커가 통째로 죽으면 서버 쪽 try/catch 로는 못 잡는다 — 넘어가는 판단은 여기서 해야 한다.
              #   핸들러가 이미 &skip= 을 지원하므로, 죽는 단계를 건너뛰고 나머지를 살린다.
              #   ★조용히 넘어가지 않는다★ — 기록에 남기고 요약이 붉게 보고한다.
              # [V33.197] ★건너뛸 단계는 이제 서버가 정한다.★ V33.196 은 재개지점(FROM)을 범인으로
              #   찍었는데, 워커가 죽으면 클라이언트는 어디서 죽었는지 알 수 없다 — 실제로 harvest 를
              #   건너뛰고도 같은 자리에서 세 번 더 죽었다(범인이 그 뒤에 있었다).
              #   워커는 단계에 들어가기 전에 이름을 남기므로, 다음 호출이 그 기록을 보고
              #   두 번 연속 죽인 단계를 스스로 건너뛴다. 여기서는 재시도만 하면 된다.
              if [ "$SOFT" -ge 4 ]; then
                echo "연속 4회 실패 — 중단(재개지점 $FROM)" | tee -a trainlog.txt
                # [V33.199] ★죽은 회차는 응답이 없다 — 범인 이름은 로그에서 집어 온다.★
                #   워커는 단계 진입 직전에 "[수동트리거:all:START] <단계>" 를 남긴다.
                #   마지막 START 가 곧 워커를 죽인 단계다. /api/logs 는 인증 없는 읽기 경로다.
                echo "" | tee -a trainlog.txt
                echo "── 워커 로그에서 마지막으로 진입한 단계를 확인한다 ──" | tee -a trainlog.txt
                # pick-logs.mjs 는 ★파일★ 을 받는다(stdin 아님) — 받아서 파일로 두고 넘긴다.
                curl -sS --max-time 60 "$URL/api/logs?limit=400" -o worklogs.json 2>/dev/null
                LAST=$(node tools/pick-logs.mjs worklogs.json '수동트리거:all:START' 200 2>/dev/null | tail -3)
                if [ -n "$LAST" ]; then
                  echo "$LAST" | tee -a trainlog.txt
                  KILLER=$(printf '%s' "$LAST" | tail -1 | sed -n 's/.*\[수동트리거:all:START\] \([A-Za-z0-9_]*\).*/\1/p')
                  [ -n "$KILLER" ] && echo "★워커를 죽인 단계: $KILLER★" | tee -a trainlog.txt
                  [ -n "$KILLER" ] && echo "killer=$KILLER" >> "$GITHUB_OUTPUT"
                else
                  echo "(로그에서 START 줄을 찾지 못했다 — 워커가 그 기록조차 남기기 전에 죽었을 수 있다)" | tee -a trainlog.txt
                fi
                break
              fi
              sleep $((SOFT*15))
              continue
            fi
            SOFT=0
            # 여러 줄 스크립트를 YAML 에 박으면 블록 스칼라가 깨진다 — 파싱은 파일이 한다.
            OUT=$(printf '%s' "$JSON" | node tools/train-line.mjs 2>/dev/null)
            NEXT=$(printf '%s' "$OUT" | sed -n 's/^RESUME=//p')
            CRASH=$(printf '%s' "$OUT" | sed -n 's/^CRASH=//p')
            LINE=$(printf '%s' "$OUT" | sed -n 's/^LINE=//p')
            # 서버가 자동으로 건너뛴 단계를 기록해 요약이 보고하게 한다.
            [ -n "$CRASH" ] && { case ",$SKIP," in *",$CRASH,"*) : ;; *) SKIP="${SKIP:+$SKIP,}$CRASH";; esac; }
            echo "회차 $ROUND: $LINE" | tee -a trainlog.txt
            printf '%s' "$JSON" > "result-$ROUND.json"
            # [V33.220] 완주 표시는 ★이번 회차의 NEXT★ 로 한다. 종전엔 루프 밖에서 FROM 을 봤는데,
            #   FROM 은 ★직전 회차의 재개 지점★ 이라 여러 회차로 완주하면 항상 비어 있지 않다.
            #   그래서 41단계를 전부 돌고도 done=0 → 빨간 X 가 떴다(실측: 실행 41 · 미실행 0 인데 실패).
            #   초록/빨강이 사실과 반대면 그 신호는 그때부터 아무도 안 믿는다.
            if [ -z "$NEXT" ]; then FINISHED=1; break; fi
            FROM="$NEXT"
            sleep 3
          done
          echo "rounds=$ROUND" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # 완주 여부 = 남은 재개 지점이 없는가. 마지막 HTTP 코드로 판정하면
          # '재시도 끝에 완주' 가 실패로 보이고 '한 회차만 돌고 멈춤' 이 성공으로 보인다.
          [ "${FINISHED:-0}" = "1" ] && echo "done=1" >> "$GITHUB_OUTPUT" || echo "done=0" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIP" >> "$GITHUB_OUTPUT"
          # 완주했을 때가 정작 값이 나오는 때다 — 단계별 결과를 작업 로그에도 찍는다.
          echo ""
          echo "── 단계별 결과 ──"
          node tools/train-results.mjs 2>/dev/null || echo "(회차 응답을 읽지 못했다)"

      - name: 결과 요약
        if: always()
        env:
          TARGET: ${{ inputs.target }}
        run: |
          CODE="${{ steps.run.outputs.code }}"
          {
            echo "### 워커 학습기 \`$TARGET\` — HTTP ${CODE:-없음}"
            echo ""
            if [ "${{ steps.run.outputs.done }}" != "1" ]; then
              echo "🔴 파이프라인이 끝까지 못 갔다(마지막 HTTP ${CODE:-없음})."
              echo "401 = TRAIN_KEY 불일치 · 503 = 워커 자원한도 · 그 외는 아래 기록 참조."
              if [ -n "${{ steps.run.outputs.killer }}" ]; then
                echo ""
                echo "🔎 **워커를 죽인 단계: \`${{ steps.run.outputs.killer }}\`** — 워커 로그의 마지막 진입 기록에서 확인."
              fi
            elif [ -n "${{ steps.run.outputs.skipped }}" ]; then
              echo "🟠 **완주했지만 건너뛴 단계가 있다: \`${{ steps.run.outputs.skipped }}\`**"
              echo "그 단계는 워커를 반복해서 죽였다(503). 나머지는 전부 돌았지만, 이건 따로 고쳐야 한다."
              echo ""
              echo "각 학습기가 돌려준 문장을 그대로 싣는다 —"
            else
              echo "각 학습기가 돌려준 문장을 그대로 싣는다 —"
              echo "**\"표본 N/최소 — 학습 대기\" 는 실패가 아니라 표본이 덜 찼다는 정상 응답이다.**"
            fi
            echo ""
            echo "**회차별 진행** (all 은 240초마다 끊고 이어서 돈다 — 아래가 그 기록이다)"
            echo '```'
            cat trainlog.txt 2>/dev/null || echo "(기록 없음)"
            echo '```'
            echo ""
            echo "**단계별 결과** (회차마다 끊기므로 회차 응답을 합쳐 싣는다)"
            echo '```'
            node tools/train-results.mjs 2>/dev/null || echo "(회차 응답을 읽지 못했다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 남은 단계가 있으면 실패로 표시한다 — 초록불로 덮으면 '뒷단이 안 돌았다' 를 놓친다.
          [ "${{ steps.run.outputs.done }}" = "1" ]
