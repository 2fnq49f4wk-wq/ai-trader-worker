name: 화면 점검 (OMNI 구조)

# [V33.440] ★실제 사이트에서 OMNI 구조 화면을 열어 잰다.★
#   사용자: "OMNI 를 보면 사이트가 멈춘다 · 디자인처럼 안 보인다". 시험장(합성 데이터)으로는 운영 페이지의
#   실제 모델·실제 페이지 부하를 못 본다. 여기서 운영 주소를 헤드리스 브라우저로 열어
#   메인 스레드 막힘 · 콘솔 오류 · 캔버스 상태 · 구조 응답 · 화면 캡처(로그의 IMG 줄)를 남긴다.
#   읽기 전용(GET · 탭 전환만).

on:
  workflow_dispatch:
    inputs:
      img:
        description: '화면 캡처를 로그에 싣는다(IMG 줄 · 로그가 커진다)'
        type: boolean
        default: false
      tabs:
        description: '두뇌 관측 전체(보기 3 · 모델 탭 11)를 탭마다 잰다'
        type: boolean
        default: false
      perf:
        description: '멈춤 추적 — CPU 프로파일(휴대폰 속도) · 아이폰 굳은 구간 · OMNI 로딩 시간 · 캡처(img 와 함께)'
        type: boolean
        default: false
      devlog:
        description: '실기기 멈춤 기록(/api/client-perf)만 읽어 요약 — 브라우저를 띄우지 않는다'
        type: boolean
        default: false
      returns:
        description: '수익률 진단 — 거래 원장을 구간·청산·진입 전략·보유 시간별로(tools/probe-returns.mjs) · 브라우저 없음'
        type: boolean
        default: false
      exits:
        description: '청산 반사실 — 청산 사유별로 판 뒤 5·10·20일 수익(시장 대비 초과)(tools/probe-exits.mjs) · 브라우저 없음'
        type: boolean
        default: false
      naver:
        description: '외부 수집원 점검 — 네이버 종목뉴스 깊이 · 야후 시세 경로(spark/chart/quote) · 브라우저 없음'
        type: boolean
        default: false
      speed:
        description: '폰 속도 — 중급 폰(CPU 4배)·빠른 4G 로 첫 방문/재방문/세 번째 방문에서 정보가 보이기까지 ms(tools/ui-probe-speed.mjs)'
        type: boolean
        default: false
      prices:
        description: '시세 정확도·신선도 — /api/state 관심종목을 야후(미국)·네이버(한국) 와 1:1 대조(tools/probe-prices.mjs) · 브라우저 없음'
        type: boolean
        default: false
      intro:
        description: '인트로 — 웹킷(아이패드·맥 사파리)·크로뮴으로 저장소 index.html 인트로를 시각별 캡처 → ui-probe-shots 가지(tools/ui-probe-intro.mjs)'
        type: boolean
        default: false
      shapes:
        description: '모델 구조 응답(/api/nn-viz 모델별 · omni-structure · ai-mode)을 ui-probe-data 가지에 저장 — 화면 설계용 · 브라우저 없음'
        type: boolean
        default: false

concurrency:
  group: ui-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: OMNI 화면 측정
    permissions:
      contents: write   # 캡처를 ui-probe-shots 가지에만 올린다(main 은 건드리지 않는다 · 배포 트리거 없음)
    steps:
      - uses: actions/checkout@v4

      - name: 워커 주소 확인
        id: url
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          NAME=$(grep -m1 '^name' wrangler.toml | sed 's/.*= *"//; s/"//')
          if [ -n "$WORKER_URL" ]; then
            echo "url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SUB=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("result") or {}).get("subdomain") or "")' 2>/dev/null)
          [ -n "$SUB" ] && echo "url=https://$NAME.$SUB.workers.dev" >> "$GITHUB_OUTPUT" || echo "url=" >> "$GITHUB_OUTPUT"

      - name: 실기기 멈춤 기록 읽기
        if: inputs.devlog && steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          curl -sS --max-time 30 "$URL/api/client-perf" -o devlog.json || true
          python3 - <<'PY'
          import json
          try: d = json.load(open("devlog.json"))
          except Exception as e: print("DEVLOG 읽기 실패", e); raise SystemExit(0)
          print("DEVLOG n", d.get("n"))
          for r in d.get("recent", [])[:60]:
              ev = r.get("ev", [])
              print("DEVLOG", r.get("build"), r.get("vp"), (r.get("ua") or "")[:90])
              for e in ev: print("DEVLOG   ", e.get("k"), e.get("ms"), "ms", "pg="+str(e.get("pg")), "vw="+str(e.get("vw")), "md="+str(e.get("md")), "om="+str(e.get("om")), "scroll" if e.get("sc") else "", "tg="+str(e.get("tg") or ""), "dy="+str(e.get("dy")), "od="+str(e.get("od")))
          PY

      # [V33.466] 화면 설계용 실제 응답 사본(읽기 전용 GET) — 모델 구조 화면을 실제 데이터 모양에 맞춰 다시 짓는다
      - name: 모델 구조 응답 저장
        if: inputs.shapes && steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data && cd data
          for m in overview mind gbdt xgb lgb cat memo seq omni dualbull dualbear; do
            curl -sS --max-time 40 "$URL/api/nn-viz?model=$m" -o "nn-$m.json" || true
            echo "SHAPE nn-$m $(wc -c < nn-$m.json) bytes"
          done
          curl -sS --max-time 40 "$URL/api/omni-structure" -o omni-structure.json || true
          curl -sS --max-time 40 "$URL/api/ai-mode" -o ai-mode.json || true
          ls -la
          git init -q && git checkout -q -b ui-probe-data
          git add . && git -c user.name=ui-probe -c user.email=ui-probe@users.noreply.github.com commit -qm "ui-probe 응답 run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ui-probe-data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 수익률 진단
        if: inputs.returns && steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          node tools/probe-returns.mjs "$URL" || true
          node tools/probe-models.mjs "$URL" || true
          node tools/probe-kr-us.mjs "$URL" || true

      - name: 청산 반사실
        if: inputs.exits && steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
          TRAIN_KEY: ${{ secrets.TRAIN_KEY }}
        run: node tools/probe-exits.mjs "$URL" || true

      - name: 폰 속도
        if: inputs.speed && steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && node tools/ui-probe-speed.mjs "$URL" || true

      - name: 시세 대조
        if: inputs.prices && steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          node tools/probe-prices.mjs "$URL" || true
          npm i --no-save --no-audit --no-fund playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && node tools/ui-probe-prices.mjs "$URL" || true

      - name: 인트로 웹킷 캡처
        if: inputs.intro
        run: |
          npm i --no-save --no-audit --no-fund playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps webkit chromium >/dev/null 2>&1
          mkdir -p shots && node tools/ui-probe-intro.mjs shots || true

      - name: 네이버 뉴스 깊이
        if: inputs.naver
        run: |
          node tools/probe-naver-news.mjs || true
          node tools/probe-yahoo.mjs || true
          node tools/probe-kr-daily.mjs "${{ vars.WORKER_URL }}" || true
          node tools/probe-kr-nxt.mjs "${{ vars.WORKER_URL }}" || true

      - name: 브라우저 준비
        if: ${{ !inputs.devlog && !inputs.returns && !inputs.shapes && !inputs.naver && !inputs.exits && !inputs.prices && !inputs.speed && !inputs.intro }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium webkit

      - name: OMNI 화면 측정
        if: steps.url.outputs.url != '' && !inputs.devlog && !inputs.returns && !inputs.shapes && !inputs.naver && !inputs.exits && !inputs.prices && !inputs.speed && !inputs.intro
        env:
          URL: ${{ steps.url.outputs.url }}
          IMG: ${{ inputs.img && '1' || '0' }}
          SHOTS_DIR: ${{ inputs.perf && inputs.img && format('{0}/shots', github.workspace) || '' }}
        run: |
          [ -n "$SHOTS_DIR" ] && mkdir -p "$SHOTS_DIR"
          if [ "${{ inputs.perf }}" = "true" ]; then node tools/ui-probe-perf.mjs "$URL" | tee probe.log
          elif [ "${{ inputs.tabs }}" = "true" ]; then node tools/ui-probe-tabs.mjs "$URL" | tee probe.log; else node tools/ui-probe-omni.mjs "$URL" | tee probe.log; fi

      - name: 캡처 올리기(ui-probe-shots 가지)
        if: always() && ((inputs.perf && inputs.img) || inputs.intro)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ -n "$(ls shots)" ] || exit 0
          cd shots && git init -q && git checkout -q -b ui-probe-shots
          echo "run ${{ github.run_id }} · $(date -u +%FT%TZ)" > RUN.txt
          git add . && git -c user.name=ui-probe -c user.email=ui-probe@users.noreply.github.com commit -qm "ui-probe 캡처 run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ui-probe-shots

      - name: 요약
        if: always()
        run: |
          [ -f probe.log ] || exit 0
          { echo "### OMNI 화면 점검"; echo ""; echo '```'; grep '^PROBE' probe.log | cut -c1-900; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
