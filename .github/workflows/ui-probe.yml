name: 화면 점검 (OMNI 구조)

# [V33.440] ★실제 사이트에서 OMNI 구조 화면을 열어 잰다.★
#   사용자: "OMNI 를 보면 사이트가 멈춘다 · 디자인처럼 안 보인다". 시험장(합성 데이터)으로는 운영 페이지의
#   실제 모델·실제 페이지 부하를 못 본다. 여기서 운영 주소를 헤드리스 브라우저로 열어
#   메인 스레드 막힘 · 콘솔 오류 · 캔버스 상태 · 구조 응답 · 화면 캡처(로그의 IMG 줄)를 남긴다.
#   읽기 전용(GET · 탭 전환만).

on:
  workflow_dispatch:
    inputs:
      img:
        description: '화면 캡처를 로그에 싣는다(IMG 줄 · 로그가 커진다)'
        type: boolean
        default: false
      tabs:
        description: '두뇌 관측 전체(보기 3 · 모델 탭 11)를 탭마다 잰다'
        type: boolean
        default: false
      perf:
        description: '멈춤 추적 — CPU 프로파일(휴대폰 속도) · 아이폰 굳은 구간 · OMNI 로딩 시간 · 캡처(img 와 함께)'
        type: boolean
        default: false

concurrency:
  group: ui-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: OMNI 화면 측정
    permissions:
      contents: write   # 캡처를 ui-probe-shots 가지에만 올린다(main 은 건드리지 않는다 · 배포 트리거 없음)
    steps:
      - uses: actions/checkout@v4

      - name: 워커 주소 확인
        id: url
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          NAME=$(grep -m1 '^name' wrangler.toml | sed 's/.*= *"//; s/"//')
          if [ -n "$WORKER_URL" ]; then
            echo "url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SUB=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("result") or {}).get("subdomain") or "")' 2>/dev/null)
          [ -n "$SUB" ] && echo "url=https://$NAME.$SUB.workers.dev" >> "$GITHUB_OUTPUT" || echo "url=" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 브라우저 준비
        run: |
          npm i --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium webkit

      - name: OMNI 화면 측정
        if: steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
          IMG: ${{ inputs.img && '1' || '0' }}
          SHOTS_DIR: ${{ inputs.perf && inputs.img && format('{0}/shots', github.workspace) || '' }}
        run: |
          [ -n "$SHOTS_DIR" ] && mkdir -p "$SHOTS_DIR"
          if [ "${{ inputs.perf }}" = "true" ]; then node tools/ui-probe-perf.mjs "$URL" | tee probe.log
          elif [ "${{ inputs.tabs }}" = "true" ]; then node tools/ui-probe-tabs.mjs "$URL" | tee probe.log; else node tools/ui-probe-omni.mjs "$URL" | tee probe.log; fi

      - name: 캡처 올리기(ui-probe-shots 가지)
        if: always() && inputs.perf && inputs.img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ -n "$(ls shots)" ] || exit 0
          cd shots && git init -q && git checkout -q -b ui-probe-shots
          echo "run ${{ github.run_id }} · $(date -u +%FT%TZ)" > RUN.txt
          git add . && git -c user.name=ui-probe -c user.email=ui-probe@users.noreply.github.com commit -qm "ui-probe 캡처 run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ui-probe-shots

      - name: 요약
        if: always()
        run: |
          [ -f probe.log ] || exit 0
          { echo "### OMNI 화면 점검"; echo ""; echo '```'; grep '^PROBE' probe.log | cut -c1-900; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
