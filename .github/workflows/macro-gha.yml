# [V33.598] 미국 경제지표 동기화 — GitHub Actions(무료). 워커의 FRED·BLS 무키 API 가 막힐 때의 2선.
#   미국 지표 발표(8:30 ET = 12:30Z 여름 · 13:30Z 겨울) 직후 몇 번 + 6시간마다. 워커는 더 새 관측월만 받는다.
name: 경제지표 동기화 (GitHub Actions · 무료)
on:
  schedule:
    - cron: "40 12 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency: { group: macro-gha, cancel-in-progress: false }
jobs:
  sync:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 워커 주소
        id: url
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$WORKER_URL" ]; then echo "url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"; exit 0; fi
          NAME=$(grep -m1 '^name' wrangler.toml | sed 's/.*= *"//; s/"//')
          SUB=$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')
          echo "url=https://$NAME.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
      - name: 지표 받기 → 워커 업로드
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          TRAIN_KEY: ${{ secrets.TRAIN_KEY }}
        run: python3 tools/gha/macro_push.py
