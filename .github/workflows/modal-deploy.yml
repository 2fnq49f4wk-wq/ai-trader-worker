name: Deploy Modal Trainer

# [V12.34] Modal DNN 학습기 재배포 자동화
#   • trainer/modal/** 가 main에 푸시되면 자동으로 modal deploy (수동 PC 작업 불필요)
#   • GitHub → Actions → "Deploy Modal Trainer" → Run workflow = 수동 재배포 버튼
#     (run_now 체크 시 배포 직후 학습 1회 즉시 실행)
#   사전 준비(1회): 저장소 Settings → Secrets and variables → Actions 에
#     MODAL_TOKEN_ID / MODAL_TOKEN_SECRET 등록 (PC의 ~/.modal.toml 값 또는 `modal token new`)

on:
  push:
    branches:
      - main
    paths:
      - 'trainer/modal/**'
  workflow_dispatch:
    inputs:
      run_now:
        description: '배포 후 즉시 학습 1회 실행'
        type: boolean
        default: false
      target:
        description: '학습 대상 — 시간 제한으로 못 끝낸 모델만 복구 가능'
        type: choice
        default: all
        # [V33.381] ★단계 이름은 트레이너의 STAGE_COST_DEFAULT 가 단일 출처다.★
        #   여기가 그것과 어긋나면 check-trainer-budget 이 배포를 막는다 —
        #   실제로 gbdt 가 빠져 있어 GBDT 만 따로 복구할 길이 없었다(게이트가 잡았다).
        options: [all, dnn, gbdt, seq, mind, memo, boosters, markets, scalp, ablate]
      # [V33.420] OMNI 복합모델만 지금 학습(별도 CPU 컨테이너 · DNN 없이). 정기 회차는 train_job 이 띄운다.
      omni_now:
        description: 'OMNI 복합모델만 지금 학습(CPU · 수 분)'
        type: boolean
        default: false
      # [V33.425g] 장중 횡단면 칸을 붙여 ★값이 있는지만★ 재는 실험 회차. 워커에 없는 칸이므로
      #   이 회차는 업로드하지 않는다(omni.run 이 거부한다 — 실험이 운영에 안 섞인다).
      omni_ksec:
        description: 'OMNI 장중 횡단면 칸 실험(재기만 · 업로드 안 함) — omni_now 와 함께'
        type: boolean
        default: false
      # [V33.204] 10층(4,580,070) DNN 이 valAcc 49.3% 로 2층 폴백(53.3%)보다 낮게 측정됐다.
      #   깊이를 추측으로 정하지 않고 ★같은 표본·같은 분할·같은 시드★ 로 후보를 재서 고른다.
      #   기본은 꺼짐 — 정기 6시간 실행에서 후보를 셋씩 학습하면 Modal 크레딧($21/$30)을 넘긴다.
      depth_sweep:
        description: 'DNN 깊이 스윕(10층/6층/3층/2층을 같은 표본으로 비교해 승자 채택) — run_now 와 함께 켜야 함'
        type: boolean
        default: false
      sweep_seeds:
        description: '순위 매길 때 후보당 시드 수(승자는 전체 시드로 재학습)'
        type: string
        default: '2'

# ══ [V33.379] ★워크플로 전체를 한 그룹에 묶어 두었더니 배포가 조용히 사라졌다.★ ══════
#   실측(2026-09-17): 04:30 에 시작된 학습(50분)이 modal-training 그룹을 잡고 있는 동안
#     35183524091 (a865c81 · V33.377 푸시)  → cancelled
#     35183933828 (내가 건 target=memo)      → cancelled
#     35184243721 (a865c81)                  → cancelled
#     35184328375 (9425dce · V33.378 푸시)  → cancelled
#   GitHub 는 `cancel-in-progress: false` 에서도 ★대기열을 하나만★ 유지한다 —
#   뒤에 들어온 실행이 앞에 대기 중이던 것을 밀어낸다.
#   그 결과 ★V33.377·V33.378 의 트레이너 고침이 Modal 에 한 번도 올라가지 않았다.★
#   (MEMO import · 단타 _vai 고침이 바로 그 안에 있다.) 그리고 실행은 'cancelled' 로만
#   남아서 "누가 취소했나 보다" 로 읽힌다 — 실패 신호가 아니다. O-1 과 같은 병이다.
#
#   ★배포와 학습은 같은 자원이 아니다.★ `modal deploy` 는 20초짜리 멱등 연산이고
#   학습을 기다릴 이유가 전혀 없다. 직렬화가 필요한 것은 ★학습★ 뿐이다.
#   → 작업을 둘로 쪼개고, 동시성 그룹은 ★학습 작업에만★ 건다.
#     이러면 trainer/modal/** 푸시는 학습이 도는 중에도 항상 배포된다.
# (Codex V33.346 의 의도 — 수동/자동 복구 직렬화 — 는 train 작업에 그대로 남는다.)

jobs:
  # ── ① 배포 — ★동시성 그룹에 넣지 않는다.★ 학습이 돌든 말든 항상 올라가야 한다 ──
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: modal deploy
    outputs:
      ok: ${{ steps.sec.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check secrets
        id: sec
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then
            echo "::warning::MODAL_TOKEN_ID/MODAL_TOKEN_SECRET 시크릿이 없어 배포를 건너뜁니다."
            echo "::warning::PC에서 'modal token new' 실행 후 Settings → Secrets → Actions 에 두 값을 등록하세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install modal
        if: steps.sec.outputs.ok == 'true'
        run: pip install modal
      # [V33.421] OMNI 학습기 자가검사 — 합성 시장에서 학습기 전 과정을 돌린다(네트워크 없음 · 약 90초).
      #   심은 신호를 찾는가 · 잡음에서 침묵하는가 · 내보낸 나무 = LightGBM · 굵은 '일봉' 거부 ·
      #   라벨 σ 가 밤사이 갭을 안 먹는가 · 가짜 워커 왕복. 실패하면 트레이너를 배포하지 않는다.
      # [V33.425c] ★같은 커밋이 러너 A 에서 2분 50초, 러너 B 에서 13분 넘게 안 끝났다.★
      #   코드가 아니라 LightGBM 이 호스트 논리 코어 수만큼 스레드를 띄워 서로 밀어낸 것으로 본다
      #   (초과구독). 러너에 실제로 있는 코어만 쓰게 못 박고, 그래도 걸리면 20분에 죽는다 —
      #   기본 6시간을 태우지 않는다.
      - name: OMNI trainer self-test
        if: steps.sec.outputs.ok == 'true'
        timeout-minutes: 20
        env:
          OMNI_THREADS: '2'
        run: |
          pip install -q numpy lightgbm requests
          cd trainer/modal && python3 omni_selftest.py
      - name: Deploy trainer (cron 갱신)
        if: steps.sec.outputs.ok == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy trainer/modal/modal_train.py

  # ── ② 학습 — 여기만 직렬화한다(수동/자동 복구가 겹치면 안 된다) ──────────────────
  train:
    needs: deploy
    if: needs.deploy.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_now
    runs-on: ubuntu-latest
    # [V33.368] 수동 학습(run_now)은 사람이 로그를 보려고 부르는 것이라 스트리밍을 남긴다. 다만 상한은 건다.
    timeout-minutes: 75
    name: modal train
    concurrency:
      group: modal-training
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modal
        run: pip install modal
      - name: Run training once now
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEPTH_SWEEP: ${{ inputs.depth_sweep }}
          SWEEP_SEEDS: ${{ inputs.sweep_seeds }}
          TRAIN_TARGET: ${{ inputs.target || 'all' }}
        # 스윕은 후보 넷을 학습하므로 정기 실행보다 오래 걸린다 — 켤 때만 인자를 붙인다.
        # [V33.350] 로그를 파일로도 받아 ★무엇을 돌리고 무엇을 건너뛰었는지★ 요약에 올린다.
        #   종전엔 예산 초과로 작업이 죽어 빨간 실패만 남았고, 그 앞에서 성공한 업로드도
        #   같이 묻혔다. 이제 작업은 예산 안에서 끝나므로 "무엇을 했나" 가 결과다.
        run: |
          set -o pipefail
          if [ "$DEPTH_SWEEP" = "true" ]; then
            echo "★DNN 깊이 스윕★ — 후보당 시드 ${SWEEP_SEEDS:-2}, 승자만 전체 시드로 재학습"
            modal run trainer/modal/modal_train.py \
              --depth-sweep --sweep-seeds "${SWEEP_SEEDS:-2}" --target "$TRAIN_TARGET" 2>&1 | tee run.log
          else
            modal run trainer/modal/modal_train.py --target "$TRAIN_TARGET" 2>&1 | tee run.log
          fi
      - name: Training summary
        if: always()
        run: |
          [ -f run.log ] || exit 0
          {
            echo "### Modal 학습 회차 요약"
            echo ""
            grep -E '^\s*(·|⏭|⚠️|✅) ' run.log || echo "(단계 로그 없음 — 표본 수집·DNN 단계에서 끝났을 수 있다)"
            echo ""
            if grep -q '예산으로 생략' run.log; then
              echo "> ⚠️ 예산 때문에 생략된 단계가 있다. **다음 회차가 그 단계부터** 시작한다(회전)."
              echo "> 지금 바로 돌리려면 Run workflow → target 에 그 단계 이름을 골라 실행하면 DNN 없이 그것만 학습한다."
            fi
            if grep -q 'FunctionTimeoutError' run.log; then
              echo "> 🔴 **timeout 으로 강제 종료됐다** — 예산 가드가 못 막은 구간이 있다."
              echo "> JOB_TIMEOUT_S·JOB_MARGIN_S 와 STAGE_COST_DEFAULT 를 실측으로 다시 볼 것."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── ③ OMNI — 별도 CPU 함수라 DNN 학습과 자원이 겹치지 않는다(직렬화 그룹 밖) ─────────
  omni:
    needs: deploy
    if: needs.deploy.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.omni_now
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: modal omni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install modal
        run: pip install modal
      - name: Run OMNI once now
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run trainer/modal/modal_train.py::omni_job --ksec ${{ inputs.omni_ksec && 1 || 0 }} 2>&1 | tee omni.log
      - name: OMNI summary
        if: always()
        run: |
          [ -f omni.log ] || exit 0
          { echo "### OMNI 복합모델 학습"; echo ""; echo '```'; grep -E 'OMNI' omni.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
