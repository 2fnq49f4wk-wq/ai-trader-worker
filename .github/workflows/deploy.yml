      - name: 메타 비선형 헤드 계약 검사 (홀드아웃 불가침 · 다중검정 · 재현성 · XOR 재현)
        run: node tools/check-meta-heads.mjs
      # [V33.207] 이 저장소의 모델 장애 상당수는 알고리즘이 아니라 ★산식★ 에서 났다:
      #   XALPHA valAcc 2.4159(정확도가 1 초과) · BRAIN 73%↔33% 진동(온도로 결정경계를 옮기려 함) ·
      #   Wilson 하한을 명목 n 으로 재서 과신 · 원+달러를 더한 PF. 전부 문법도 통과하고 예외도
      #   안 나는데 값이 틀린 종류다. 순수 수학 함수를 실제 파일에서 뽑아 ★정의식·문헌값★ 과 대조한다.
      - name: 수치 계산식 감사 (정의식 대조 · 경계 · 범위 가드)
        run: node tools/check-math.mjs
      # [V33.156] 설치형(PWA) — 서비스워커는 이 저장소가 반복해서 겪은 ★낡은 화면★ 문제를
      #   증폭시키기 가장 쉬운 장치다. 그래서 문서와 API 는 네트워크 우선으로 못박고,
      #   캐시는 오프라인 폴백으로만 쓴다. 이 게이트는 그 순서를 코드에서 직접 읽어 확인한다.
      - name: PWA 계약 검사 (매니페스트 · 아이콘 · 네트워크 우선)
        run: node tools/check-pwa.mjs
      # [V33.156] 폰 화면 개편 — 아이패드·PC 는 "지금과 똑같이" 가 요구조건이었다.
      #   폰 규칙이 미디어쿼리 밖으로 한 줄만 새도 그 약속이 깨지고, 셸 여백과 바 높이가
      #   어긋나면 ★설치했을 때만★ 본문이 노치·홈바에 깔린다(웹에선 안 보인다).
      #   글벽을 접은 아코디언은 함수를 실제로 돌려 "접기이지 지우기가 아님"을 센다.
      - name: 폰 화면 계약 검사 (격리 · 안전영역 · 아코디언 무손실)
        run: node tools/check-mobile.mjs
      # [V33.159] 한국장 매매정지 — 사이드카 ±5/6%, 서킷브레이커 -8/-15/-20% 는
      #   한국거래소 규정이라 우리가 고를 수 있는 값이 아니다. 하나만 틀려도 화면이
      #   규정과 다른 말을 하고, 그걸 보고 판단하면 사람이 손해를 본다.
      #   구현을 흉내내지 않고 함수 원문을 떼어 실제로 돌려 확인한다.
      - name: 한국장 매매정지 계약 검사 (사이드카 · 서킷브레이커)
        run: node tools/check-kr-halt.mjs
      # [V33.162] 종목별 애널리스트 자료 — 요구는 하나였다: "추측 말고 발표난 걸로".
      #   그래서 검사도 하나다 — 화면에 나가는 숫자의 출처가 분명한가.
      #   못 받으면 비우는지, 출처를 늘 밝히는지, '발표 원문' 과 '우리 관측' 을
      #   섞지 않는지, 국내 종목 경로가 실제로 있는지.
      - name: 종목별 애널리스트 자료 계약 검사 (출처 · 발표/관측 구분)
        run: node tools/check-analyst-detail.mjs
      # [V33.163] 국내 증권사 리포트 파서 — 표의 열 순서를 우리가 정할 수 없고
      #   이 세션에서는 응답을 실측하지도 못했다. '몇 번째 칸' 이 아니라 생김새로 고르는데,
      #   그 규칙이 흔들리면 엉뚱한 숫자가 목표가로 올라간다. HTML 모양을 여러 개 만들어 돌린다.
      - name: 국내 증권사 리포트 파서 검사 (열 순서 무관 · 오인 방지)
        run: node tools/check-kr-broker.mjs
      # [V33.166] 국내 목표주가 추출 — 두 번 실패한 원인이 같았다: '표의 몇 번째 칸' 가정.
      #   구조를 버리고 '목표주가' 라는 말 뒤의 숫자를 찾는다. 여러 모양에서 통하는지와,
      #   무엇보다 ★아무 숫자나 줍지 않는지★ 를 본다(엉뚱한 값은 조용한 거짓말이 된다).
      - name: 국내 목표주가 추출 검사 (라벨 앵커 · 오인 방지)
        run: node tools/check-kr-consensus.mjs
      # [V33.169] 심화 재무분석 · 동일 업종 비교.
      #   업종 비교는 '상대 위치' 를 말한다 — 방향(높을수록 좋음/나쁨)을 한 번만 틀리면
      #   발생액이 높은 기업이 '업종 상위' 로 뜬다. 숫자는 그럴듯하고 뜻은 정반대다.
      #   산식은 손계산과 대조하고, 표본 부족·결측 처리·조회 비용까지 함께 본다.
      - name: 심화 재무분석·업종 비교 계약 검사 (산식 · 방향 · 표본)
        run: node tools/check-fund-peer.mjs
      # [V33.170] 사이클 상수 캐시 — 증상은 CPU/시간이었지만 원인은 D1 왕복이었다.
      #   mlDeepDecide 가 호출당 14회 읽는데 스캔 경로가 그 값을 안 넘겨 종목마다 다시 읽었다.
      #   호출부마다 opts 를 채우는 방식은 또 빠뜨릴 수 있어(실제로 그랬다) 읽기 자체를 기억한다.
      #   쓰기가 나면 즉시 잊는지(학습 결과를 옛 값으로 읽지 않는지)를 함께 확인한다.
      - name: 사이클 상수 캐시 계약 검사 (왕복 횟수 · 쓰기 무효화)
        run: node tools/check-cyc-memo.mjs
      # [V33.171] 라운드로빈 커버리지 — "전 종목을 도는가, 같은 종목만 도는가".
      #   형태트리거가 매 사이클 118~227종목을 승격시켰는데 예산으로 실제 평가되는 것은 6~62종목뿐이라
      #   순환 대기열에 한 번도 도달하지 못했다. 순환 진도가 늘 0이라 오프셋이 사이클당 한 칸씩만 갔다
      #   (557종목 한 바퀴 ≈ 9시간). 실제 소스를 떼어 여러 사이클을 모의해 완주를 확인한다.
      - name: 라운드로빈 커버리지 검사 (전 종목 완주 · 오프셋 전진)
        run: node tools/check-roundrobin.mjs
      # [V33.172] 평가 예산 총량 + 외부학습 커밋 가시성.
      #   평가 루프의 부가조회가 기능마다 자기 몫만 보고 늘어나(단타 35~45% + FLOW 무제한 +
      #   옵션 무제한) 사이클당 평가가 450종목 → 34종목으로 주저앉았다. 총량 지갑으로 막는다.
      #   커밋 500 이 8일간 조용했던 문제도 함께 — '보낸 시각'이 아니라 '들어온 결과'를 표시한다.
      - name: 평가비용·학습가시성 검사 (부가조회 총량 · 커밋 관측)
        run: node tools/check-eval-cost.mjs
      # [V33.173] 표본 시각 계약. 소급생성이 ts 에 적재 시각을 찍어, 몇 달치 시장이 하루로 뭉쳤다.
      #   퍼징이 그걸 전부 '검증 구간 침범'으로 보고 학습셋을 통째로 잘랐다
      #   (실측: XALPHA 표본 1,921 → 학습표본 0/800, FLOW 7,788 → 298/800).
      #   "표본은 다 모였는데 학습이 안 된다"의 정체다. 퍼징 식을 떼어 재현·검증한다.
      - name: 표본 시각 검사 (관측 시각 · 퍼징 생존율)
        run: node tools/check-sample-ts.mjs
      # [V33.176] 표본 전달 계약. R2 스냅샷 행에 s(종목)가 빠져 트레이너가 온 표본을 한 종목으로
      #   보고 고유도를 쟀다 — 유효표본 183,948 → 31건, Wilson 하한 24%, trustFloor 영구 미달.
      #   표본 부족처럼 보였지만 한 칸이 빠진 것이었다. 모든 내보내기 경로의 필드를 맞춰 검사한다.
      - name: 표본 전달 검사 (종목 필드 · 스냅샷 스키마 판)
        run: node tools/check-ml-export.mjs
      # [V33.245] featVer 를 올렸는데 모델이 안 따라온다. V33.239 가 13→14(65→69) 로 판을
      #   올렸지만 그날 낮 v13 으로 찍힌 ai_stage 도장이 살아남아 야간 파이프라인이 잠겼고,
      #   외부 자동 재학습은 trainedAt 만 보느라 "10.8h 전 학습" 을 신선하다고 판정했다.
      #   결과: 표본은 51.7만건 v14 인데 MIND·DNN·GBDT 전부 v13 → 위원회 전원 낙마,
      #   aiReady:false / RULE_FALLBACK. 판 상향이 재학습으로 이어지는지 계약으로 고정한다.
      - name: featVer 무효화 검사 (판 상향 → 재학습 전파)
        run: node tools/check-featver-invalidation.mjs
      # [V33.246] KR 종목이 소급생성에서 100% 실패하고 있었다(로그 27사이클, 잔차 4/12건).
      #   네이버 분봉은 '지금 세션' 만 준다 — 개장 전엔 빈 배열이라 그대로 예외가 된다.
      #   벽시계 25초 예산의 7할이 한 번도 성공한 적 없는 호출에 들어가 US 처리량을 깎았다.
      #   세션 밖엔 부르지 않는다. 실측 재현 + 개장전/장중 실제 실행으로 무손실을 확인한다.
      - name: KR 장중 창 검사 (헛 fetch · 휴장≠고장 · 실패 사유)
        run: node tools/check-kr-intraday-window.mjs
      # [V33.247] 화면 3/8. Modal 학습이 3연속 IndexError(size 8)로 죽고 있었다.
      #   워커 익스포트가 total=8 짜리 R2 스냅샷을 D1(51.7만)보다 우선 서빙했기 때문이다 —
      #   featVer 13→14 직후 v14 풀이 8건이던 순간에 찍힌 사진이 26시간 진실 행세를 했다.
      #   신선도를 시계로만 재지 않는다. 그리고 학습기는 크래시 대신 이유를 적고 멈춘다.
      - name: 표본 스냅샷 드리프트 검사 (굶은 사진 · 소스 혼합 · 학습기 가드 위치)
        run: node tools/check-snapshot-drift.mjs
      # [V33.248] "MIND 미학습 · 위원장 부재" 의 실체. 표본풀 518,000건인데 위원장은 600행으로
      #   심사받고 있었다 — trainWindow 15,000 이 val ×0.2 → 메타 뒤40% → τ* 뒤절반 을 거쳐
      #   600행이 되고, 고유도 0.0667 을 곱해 유효 40건. Wilson 하한 41.2%(관측 41.1%)가
      #   다수클래스 47.4% 선을 못 넘어 회귀가드가 발행을 거부했다.
      #   고유도는 정상값이다. 학습이 감당할 크기와 평가가 필요한 크기를 분리한다.
      - name: MIND 평가표본 검사 (학습창≠평가창 · FM CPU 중립 · 자 휘기 금지)
        run: node tools/check-mind-eval-size.mjs
      # [V33.249] 위원장(MIND)을 FM 에서 트리로 교체. FM 은 GPU 완전수렴(시드 6 · 검증 51,800행
      #   · 유효 3,555)에서도 47.9% 였고, 같은 표본 같은 날 트리는 53.5~54.2%(IC t 2.5~4.7)였다.
      #   CPU·수렴이 아니라 모델 형태가 안 맞는 것이다. 자리·안전장치는 그대로 두고 내용물만 바꾼다.
      #   합성 트리를 실제로 위원장 슬롯에 넣고 채점해 트리 확률과 일치하는지 확인한다.
      - name: 트리 위원장 검사 (실채점 일치 · 안전장치 동등 · 사본 금지)
        run: node tools/check-mind-tree.mjs
      # [V33.277] 단타 모델이 valAcc 63.1%(하한 61.9% vs 기저 51.3%)로 학습되고도 승격을
      #   거부당했다(convMaxDiff 0.4132, 문턱 0.03). 원인은 이름이었다 — 채점기는
      #   bias·eta 를 읽는데 단타 임포트는 base·lr 로 저장했다. base 가 사라지고 eta 가
      #   0.06 으로 대체된 채 채점되니 정합이 맞을 수가 없다. 번역을 한 곳으로 모았고,
      #   이 검사가 ★옛 방식이 틀렸음을 재현★ 하고 ★고친 뒤 오차 0★ 을 확인한다.
      - name: GBDT 업로드 필드 계약 검사 (이름 단일화 · 정합 재현 · 손복사 금지)
        run: node tools/check-gbdt-fields.mjs
      # [V33.250] 신규 전략 5종(지수리밸런스·변동성타겟추세·페어OU·거래량급증역추세·횡단면차익).
      #   합성 데이터로 다섯을 실제로 돌려 발화/침묵을 확인하고, OU 반감기·분산비·OLS β 를
      #   알려진 값과 대조한다. 공매도가 없어 페어·횡단면은 롱 다리만이라는 ★한계 표기★ 가
      #   신호 문구에 남아 있는지, VT_TREND 의 사이즈 배율이 실제 수량에 연결됐는지도 본다.
      - name: 신규 전략 검사 (발화·침묵 · 수학 · 한계표기 · 사이즈 연결)
        run: node tools/check-new-strategies.mjs
      # [V33.251] 이중헤드가 표본 6만에 블록IC 0.0005(t 0.01) 였다. 표본 문제가 아니라
      #   ①라벨이 종목마다 다른 질문(절대 ±2%: 1%/일 종목엔 0.6σ, 4%/일 종목엔 0.16σ)
      #   ②선형 모델(같은 데이터에서 트리가 크게 이긴다) 이었다.
      #   문턱을 종목 변동성으로 정규화하고 비선형 헤드 경합을 켠다.
      #   전략 선택도 함께: 첫 번째로 걸리는 것이 아니라 실현기대값으로 고른다(켈리는 유지).
      - name: 이중헤드·전략선택 검사 (라벨 정규화 · 비대칭 문턱 · 켈리 보존)
        run: node tools/check-dualhead.mjs
      # [V33.255] 신호 이름이 선언과 실재 두 방향으로 갈라져 있었다.
      #   ① 설정에만 있는 허구: phaseAdapt 의 TR_52W · SN_OVERSOLD — 내보내는 평가기가 없다.
      #   ② 실재하는데 대장에 없음: 신규 6종이 SIGNAL_TYPES 에 빠져 signal_type_stats 가
      #      영원히 비었다 → _pickBestSignal 이 실현기대값 대신 confidence 비교로 퇴화.
      #   둘 다 조용히 아무 일도 안 일어나는 종류라 로그로는 잡히지 않는다.
      #   평가기 본문에서 실제로 내보내는 이름을 뽑아 양방향으로 대조한다.
      - name: 신호 대장 검사 (허구 이름 금지 · 살아 있는 신호는 전부 등재)
        run: node tools/check-signal-registry.mjs
      # [V33.255] 단타 학습이 featVer 를 올릴 때마다 죽고 있었다 —
      #   장중 표본은 기록 시점의 featVer 로 저장되는데 트레이너가 x 의 폭을 안 쟀다
      #   (ix 는 재면서). np.array 가 inhomogeneous shape 로 죽고, 스윙은 멀쩡하니
      #   화면엔 아무 표시도 안 난다. 겸사겸사 V33.98 의 '페이징' 도 확인한다 —
      #   서버는 offset 을 되비추기만 했고 hasMore 는 false 로 굳어 있었다.
      # 이 검사는 운영에서 난 ValueError 를 ★실제로 재현★ 해서 확인한다 — numpy 가 필요하다.
      #   (러너에는 기본 설치가 없어 첫 배포가 여기서 떨어졌다. 검사를 무르게 만드는 대신
      #    도구를 설치한다 — "없으면 건너뛴다" 로 고치면 영원히 초록인 장식이 된다.)
      - name: Install numpy (단타 표본 검사용 — 운영 오류 재현)
        run: python3 -m pip install --quiet --break-system-packages numpy
      - name: Model recovery and extended quote provenance
        run: node tools/check-recovery-provenance.mjs
      - name: 단타 표본 폭·페이징 검사 (오류 재현 · 누락/중복 0)
        run: node tools/check-scalp-featdim.mjs
      # [V33.257] 자가진단이 "보조 모델 1종" 이라 적고 있었다. 같은 응답의 externalTrain 에는
      #   6종이 전부 trained·ageH 5 였고 XGB 0.5354 / LGB 0.5324 / Cat 0.5409 로 멀쩡했다.
      #   식이 (DNN?1:0)+(GBDT?1:0) 두 칸짜리였다 — 부스터 3종·이중헤드가 안 세진다.
      #   틀린 숫자보다 그 숫자를 보고 ★멀쩡한 것을 고치러 들어가는 것★ 이 더 비싸다.
      #   보고가 위원회와 같은 함수를 쓰는지만 본다(맞는 숫자는 내일 또 틀린다).
      - name: 자가진단 명단 검사 (보고가 위원회와 같은 함수를 쓰는가)
        run: node tools/check-selfcheck-roster.mjs
      # [V33.260] DNN accLB 47.27% — 동전 던지기보다 낮은데 6시간마다 GPU 는 계속 탄다.
      #   같은 51만 표본에서 트리들은 53~54% 다. 데이터에 신호가 없는 게 아니다.
      #   그리고 그 사실은 V33.204 스윕이 이미 쟀는데(10층 49.3% vs 2층 53.3%)
      #   ★결과가 어디에도 저장되지 않아★ 정기 실행은 매번 같은 구성으로 돌았다.
      #   이 검사는 성능이 아니라 ★측정 → 저장 → 다음 학습에 반영★ 고리가 닫혀 있는지만 본다.
      - name: DNN 구성 측정-반영 고리 검사 (잰 값이 실제로 쓰이는가)
        run: node tools/check-dnn-arch.mjs
      # [V33.261] 한국 유니버스 400 → 450. CLAUDE.md 규칙("종목 추가 시 DEFAULT_KR·NAME_MAP·
      #   MCAP_RANK 세 곳을 함께 갱신")을 사람이 손으로 맞추면 언젠가 하나를 빠뜨리는데,
      #   빠뜨린 표는 예외가 아니라 ★조용히★ 틀린다(이름 없으면 코드만 뜨고, 순위 없으면
      #   시총 폴백이 그 종목만 건너뛴다). 접미사(.KS/.KQ)도 함께 본다.
      #   상장폐지는 사전에 못 막는다 — 넣는 날이 아니라 그 뒤 아무 때나 일어나므로
      #   운영이 데이터로 잡는다(univHealthNightly). 그 배선까지 확인한다.
      - name: 한국 유니버스 검사 (접미사 · 세 표 동기 · 죽은 티커 탐지 배선)
        run: node tools/check-kr-universe.mjs
      # [V33.262] 화면의 "4층 딥넷" 은 층이 줄어서가 아니라 dims.length 를 그대로 '층' 이라
      #   부른 탓이었다(dims=[입력,은닉…,출력]). 은닉 10층은 "12층", 폴백 2층은 "4층" 으로 나온다.
      #   그리고 진짜 문제: 부스터에는 IC 길이 있는데 DNN 승격만 정확도 길 하나였다.
      #   이 검사는 "문턱을 낮췄나" 를 묻는다 — IC 길은 정확도 바닥을 여전히 요구해야 한다.
      - name: DNN 승격 판정 검사 (은닉층 보존 · IC 길이 무르지 않은가)
        run: node tools/check-dnn-admit.mjs
      # [V33.264] 옵션 미시구조(GEX·0DTE·OI·convexity·델타감마 테일러) — ★기록 단계★.
      #   야후는 현재 체인만 준다. 과거 체인이 없으니 51만 표본에 소급이 불가능하고,
      #   지금 피처로 밀어 넣으면 모델은 "GEX가 0이 아니면 최근 데이터" 를 배운다.
      #   그래서 오늘부터 쌓기만 한다. 이 검사는 ①수학이 맞는가(답을 아는 값으로 검산)
      #   ②기록이 학습을 건드리지 않는가, 실패해도 야간 파이프라인을 안 끊는가를 본다.
      - name: 옵션 미시구조 검사 (그릭스 검산 · 기록이 학습을 안 건드리는가)
        run: node tools/check-opt-micro.mjs
      # [V33.265] 달력 사건 피처(OpEx 3 + FOMC 3, featVer 14→15 · 69→75).
      #   옵션 체인과 달리 날짜만 있으면 과거를 전부 재구성할 수 있어 소급 학습이 된다.
      #   조용히 죽는 길이 셋이라 전부 막는다: ①obsTs 를 안 넘기는 호출부 ②수확기가
      #   정렬용 근사 ts 를 달력에 쓰는 것(2000봉이면 800일 어긋난다) ③FOMC 표 만료.
      - name: 달력 사건 피처 검사 (OpEx 전수 · FOMC 표 만료 · obsTs 배선)
        run: node tools/check-calendar-feats.mjs
      # [V33.267] SEQ — DNN 을 Transformer 로 승급. 위험은 성능이 아니라 ★학습·추론 불일치★ 다
      #   (V32.11 BatchNorm 접기에서 겪었다). 그래서 이 검사는 성적을 묻지 않는다:
      #   ①워커 JS 가 정말 그 수식인가(numpy 독립구현과 대조) ②트레이너가 같은 순서로 계산하는가
      #   ③시퀀스 자리가 정말 '그 봉' 인가 ④★위원회를 직접 돌려★ 표가 들어가는가(저장만 하는
      #   죽은 레코드가 되지 않게) 를 본다.
      - name: SEQ Transformer 검사 (수식 정합 · 시퀀스 정렬 · 위원회 배선)
        run: node tools/check-seqformer.mjs
      # [V33.268] 최적정지(Longstaff-Schwartz). "지금 팔까 더 들고 갈까" 는 미국식 옵션의
      #   조기행사와 같은 문제다. 몬테카를로는 틀려도 그럴듯한 숫자를 내므로, 이 검사는
      #   ★답을 아는 문제★ 로 검산한다: 논문(2001) Table 1 공표값 6건, 그리고 Merton 정리
      #   (배당 없는 주식의 미국식 콜 = 유럽식 콜). 둘 다 외부 기준이라 구현이 틀리면 못 맞춘다.
      #   그리고 교과서 문제와 실제 청산 판단이 ★같은 엔진★ 인지, 근거가 쌓이기 전에
      #   실거래를 안 흔드는지(advisoryOnly)까지 본다.
      - name: 최적정지 검사 (논문 공표값 대조 · Merton 정리 · 자문 규율)
        run: node tools/check-lsm.mjs
      # [V33.269] SEQ 3D 관측. 다른 위원은 축이 둘이라 2D 로 충분한데 이 모델만 셋이다
      #   (피처 · 시점 · 단계) — 납작하게 그리면 "어느 시점이 어느 시점을 보는가" 가 접혀
      #   사라지는데, 그게 이 모델을 넣은 이유다. 검사는 ①화면 숫자가 저장된 가중치에서
      #   나오는가 ②어텐션이 ★채점에 쓰이는 그 함수★ 에서 나오는가(두 번째 구현 금지)
      #   ③사영이 정말 3D 인가(원근·회전·깊이순서·Y 뒤집힘) ④모르는 것을 안 그리는가.
      #   화면 코드는 index.html 안에 있어 ★그 텍스트를 떼어 그대로 실행★ 한다(브라우저 안 띄운다).
      - name: SEQ 3D 관측 검사 (가중치 출처 · 어텐션 단일구현 · 사영 수학)
        run: node tools/check-seq3d.mjs
      # [V33.276] 사용자 보고: "터치하면 역방향으로 움직인다". 실제로 그랬다 — 이 사영에서
      #   카메라를 향한 면의 dX/dyaw 는 −1 인데 회전식이 yaw += dx 였다(오른쪽으로 끌면
      #   앞면이 왼쪽으로 갔다). 방향은 눈으로만 확인하면 반드시 다시 뒤집히므로, 검사가
      #   ★화면 코드의 회전식을 떼어 사영에 넣고★ 앞면이 손가락을 따라가는지 수치로 잰다.
      #   두 손가락 확대·프레임 병합·툴팁 절약도 같이 문다(성능을 얻고 기능을 잃지 않게).
      - name: SEQ 3D 조작·성능 검사 (손가락 방향 · 핀치 · 프레임 병합)
        run: node tools/check-seq3d-touch.mjs
      # [V33.278] 사용자: "3d 보는거 아직 불편해 · dnn 디자인 개선". 안 읽히던 이유는 각도가
      #   아니라 단서 부족이었다 — 시점 16장이 전부 같은 세기라 앞뒤가 안 갈렸고, 시점
      #   번호는 툴팁에만 있었는데 그 툴팁은 돌리는 중엔 없다(V33.276). 안개·초점·바닥
      #   눈금·펼침을 넣었다. 이 검사는 ★화면 코드의 세기 식을 떼어 돌려★ 앞뒤가 실제로
      #   갈리는지 재고, 세기만 바뀌고 자리·값은 그대로인지 확인한다.
      #   DNN 쪽은 엣지를 ★건드리지 않았는지★ 까지 문다 — V12.95 의 사용자 요청이다.
      - name: 관측 화면 읽힘 검사 (깊이 단서 · 초점 · 눈금 · DNN 강도색)
        run: node tools/check-viz-legibility.mjs
      # [V33.287] V33.284 축 교체에서 좌표 참조 한 곳(ST[3].x·pz)을 놓쳐 ReferenceError 가
      #   났고 ★그림 전체가 안 그려졌다.★ 그런데 기존 검사 넷은 전부 통과했다 — 사영 수학,
      #   조작 식, 세기 식을 각각 ★조각으로만★ 봤기 때문이다. 합쳐서 한 번 그려 보는
      #   검사가 없었다. 이제 스텁 DOM 위에서 진짜로 그려 본다(상태 10종을 눌러 가며).
      #   NaN 좌표도 잡는다 — 그건 예외도 안 나고 브라우저가 조용히 안 그린다.
      - name: SEQ 3D 실렌더 검사 (진짜로 그려 본다 · 상태 10종 · NaN 좌표)
        run: node tools/check-seq3d-render.mjs
      # [V33.280] 운영 스냅샷이 "build V33.272" 를 보고했다 — 코드는 V33.279 였는데 버전
      #   문자열만 일곱 번 배포 동안 멈춰 있었다. 화면이 자기 자신에 대해 거짓을 말하면
      #   다른 숫자의 신뢰도까지 같이 깎인다. 소스 최신 [V33.NNN] 과 _BUILD_VER 를 대조한다.
      - name: 배포 버전 계약 검사 (소스 최신과 일치 · 손으로 적은 버전 금지)
        run: node tools/check-build-ver.mjs
      # [V33.280] 같은 순간 사이드바는 "이중헤드 IC 미달 대기", 두뇌 화면은 "잠정 합류
      #   ×0.25 · t 4.26" 이라고 적고 있었다. 사이드바가 trusted(엄격 플래그)만 보고
      #   admit(실제 합류 판정)을 안 봤고, 서버도 이중헤드에만 admit 을 안 실어 줬다.
      #   게다가 같은 이름 'IC' 로 원시값과 블록값을 각각 적어 숫자까지 달랐다.
      - name: 사이드바·두뇌 일치 검사 (admit 단일출처 · 같은 이름 같은 값)
        run: node tools/check-sidebar-parity.mjs
      # [V33.301] 위 검사는 ★값 하나★(admit·IC)를 맞췄지, 판정이 여러 곳에 있는 구조는
      #   그대로 뒀다. 그래서 또 났다 — 오른쪽 사이드바는 불이 꺼지고 구조 관측은 켜졌다.
      #   화면에 "불이 들어오는가" 를 각자 답하는 술어가 일곱 개 있었던 것이 원인이다.
      #   이제 판정은 서버 명부(buildRoster) 하나이고, 이 검사가 (a) 모든 응답이 그 명부를
      #   싣는지 (b) 화면에 판정 술어가 되살아났는지 (c) 같은 명부로 세 화면이 같은 답을
      #   내는지 실제로 돌려 보고 (d) 갈라진 술어를 다시 넣으면 실패하는지까지 본다.
      - name: 위원 명부 단일출처 검사 (사이드바·구조 관측·신경망 지도 동일 데이터)
        run: node tools/check-roster-single-source.mjs
      # [V33.303] "검증이 낮다" 의 실체는 홀드아웃이 달력으로 2~3주뿐이라는 것이었다.
      #   MEMO 실측: 홀드아웃 블록IC −0.0390(t −1.88) vs 전진(진짜 표본밖) IC +0.14781(t 2.42).
      #   부호가 반대다 — 잣대가 모델이 아니라 그 13일의 시장 방향을 재고 있었다.
      #   홀드아웃을 달력(minBlocks × 라벨지평)에 못 박고, 학습은 엠바고 이전에서만 뽑는다.
      #   그리고 "전진표본 0/400" 이 왜 0 인지(고를 행 없음/배치하한/라벨/NaN)를 구분해 말한다.
      - name: 홀드아웃 고정·전진 사유 검사 (판정 가능한 기간 · 엠바고 · 0의 이유)
        run: node tools/check-holdout-anchor.mjs
      # [V33.304] 운영 실측: 부가조회 지갑 7,242/7,200ms 소진 · 그중 flow 6,737ms.
      #   그런데 그 사이클에 flow 가 네트워크를 탄 종목은 6개뿐이다 — fetch 대기가 아니라
      #   ① 종목마다 유니버스 전체의 로그수익을 다시 계산(Math.log 400만 회/사이클)
      #   ② 종목마다 flowpos/flowopt 를 getState (평가 124종목이면 D1 왕복 248회)
      #   그 결과 scalp·옵션 조회가 30건 생략되고 평가가 8% 에서 끊겼다(TIME-CAP).
      #   이 검사는 ★값이 비트 단위로 같은지★ 를 옛 구현과 대조해 "성능을 낮춰 CPU 를 번 것이
      #   아님" 을 증명하고, 왕복이 실제로 사라졌는지 본다.
      - name: FLOW 평가비용 검사 (값 동일 · 캐시 오염 없음 · D1 왕복 제거)
        run: node tools/check-flow-peer-cpu.mjs
      # [V33.306] MEMO 의 k-means 는 표본 24,000 × 원형 128 × 축 75 × 6반복 ≈ 14억 회다 —
      #   워커 CPU 를 가장 많이 먹는 학습이고, 그 예산 때문에 학습창이 67일에 묶여 있었다.
      #   Modal 로 옮기되 ★같은 모델이어야★ 한다. 이 검사는 트레이너의 학습·채점 함수를 떼어
      #   실제로 파이썬으로 돌리고, 그 원형책을 워커 memoScore 로 다시 채점해 대조한다.
      #   (두 언어가 갈라지면 성적으로만 드러나는 조용한 오염이 된다)
      - name: MEMO 외부학습 검사 (두 언어 정합 · probe 필수 · 워커 폴백 유지)
        run: node tools/check-memo-modal.mjs
      # [V33.307] ① 야간 단계별 비용을 재는가(다음 이관 대상을 추측이 아니라 표로 고르게)
      #   ② ★검사는 PR 에서 돌고 배포는 push 에서만 도는가★ — 이 검사가 실제로 사고를 잡았다.
      #   처음엔 이미 if 를 갖고 있던 두 단계에 if 를 한 줄 더 붙였는데, YAML 중복 키는
      #   뒤엣것이 이기므로 push 가드가 조용히 죽어 ★PR 이 프로덕션에 배포하는★ 상태였다.
      - name: 단계비용 계측 · PR 검사 계약 검사 (죽어도 남는 기록 · PR 은 배포 금지)
        run: node tools/check-stage-cost.mjs
      # [V33.308] "memo 를 눌렀는데 dnn 이 보인다" — openNnViz 를 부르는 자리가 다섯이라
      #   요청이 겹치는데 도착 순서대로 무조건 그렸다. 제일 무거운 DNN 응답이 뒤늦게 와서
      #   새 탭 그림을 덮었다. 그리고 왜 하필 늘 DNN 이었나 — 분기가 kind 를 보다가 아무
      #   데도 안 걸리면 ★말없이 DNN 렌더러로 떨어졌기★ 때문이다(mlDNNVizData 만 kind 가
      #   없었다). 원인 셋이 증상 하나로 나오면 어디가 틀렸는지 알 수가 없다.
      #   이 검사는 가짜 DOM·가짜 fetch 로 그 경합을 ★실제로 재현해★ 본다.
      - name: 두뇌관측 탭 전환 검사 (늦은 응답 폐기 · 모델 어긋난 그림 금지)
        run: node tools/check-nnviz-switch.mjs
      # [V33.310] ★게이트가 자기 자신의 실종을 못 본다★ — 게이트는 이 파일에 한 줄씩 손으로
      #   배선된다. 뒤진 바닥(예: V33.304 에서 갈라진 V33.305 브랜치, 게이트 80종)의
      #   deploy.yml 이 얹히면 새 게이트가 목록에서 사라지는데, 그 사라짐을 알아챌 사람이
      #   바로 사라진 그 게이트다. 파일은 저장소에 남아 있어 ls 로도 티가 안 난다.
      #   그래서 "파일 목록 = 배선 목록" 을 강제하고, 버전이 뒤로 가는지도 함께 본다.
      - name: 뒤진 바닥 검사 (게이트 배선 누락 · 빌드 버전 되감기)
        run: node tools/check-stale-base.mjs
      # [V33.272] STACK 에 SEQ 슬롯. 위원 목록이 이 파일에 손으로 네 번 적혀 있었다 —
      #   하나만 고치고 셋을 놓치면 STACK 이 "그 자리는 boost" 라고 배운 채로 다른 확률을
      #   받는다(성적으로만 드러나는 사고). 지금은 STACK_SLOTS 하나뿐이고, 이 검사가
      #   그 사실과, 소급생성이 seq 를 정직하게 기권하는지(ts 근사로 재구성하지 않는지)를 본다.
      - name: STACK·SEQ 배선 검사 (슬롯 단일출처 · 라이브 결합 · 소급생성 기권)
        run: node tools/check-stack-seq.mjs
      # [V33.273] 미달 모델 둘을 실제로 끌어올린 고침. 둘 다 "성적으로만 드러나는" 종류다 —
      #   밴딧: 낱개 순열이 피처 상관 아래에서 붕괴해 67/67 이 제외되고 ★한 번도 켜진 적이
      #   없었다★(운영 실측 "컨텍스트 0차원 < 2"). 군집을 통째로 섞어 다시 잰다 — 문턱은 그대로다.
      #   MEMO: 거리가 75축을 등가중으로 세, 잡음축이 이웃을 정했다(valAcc 49.6% — 기저 아래).
      #   축마다 라벨 상관으로 눌러 잰다. 이 검사는 ★완화가 아니라 개선★ 인지까지 본다
      #   (dropFloor·icFloor·원형 수가 그대로여야 통과한다).
      - name: 밴딧 상관강건 검정 · MEMO 가중거리 검사 (붕괴 재현 · 위양성 · 누출 · 완화금지)
        run: node tools/check-bandit-memo.mjs
      # [V33.288] 그 관련도 가중이 ★시장 원핫까지 지워버렸다★ — 시장은 라벨과의 marginal
      #   상관이 0 에 가까워 잡음바닥 아래로 떨어지고, 가중이 정확히 0 이 된다. 그래서
      #   삼성전자의 '가장 닮은 과거' 로 미국 표본이 뽑힐 수 있었다. 시장은 무게를 줄 축이
      #   아니라 칸막이다 — 원형책을 시장별로 세우고 추론도 같은 시장만 뒤진다.
      #   이 검사는 ★이득과 비용을 둘 다 측정★ 한다: 시장마다 예측 가능성이 다른 데이터에서
      #   혼합책 대비 IC 가 실제로 오르는지, 시장이 무의미한 데이터에서 얼마를 까먹는지.
      #   해상도 증설을 몰래 섞지 않았는지(총 원형 수 = K)도 함께 본다.
      - name: MEMO 시장 칸막이 검사 (원인 재현 · 교차선택 0 · 구모델 호환 · 이득/비용 실측)
        run: node tools/check-memo-market.mjs
      # [V33.291] 같은 질문을 ★자★ 에도 던졌더니 더 큰 게 나왔다 — IC 를 시장을 섞은 채 재고
      #   있었다. 두 시장의 기저승률이 다르면 "시장을 아는 것" 만으로 p 와 y 가 같이 움직인다.
      #   몬테카를로(시장 안 실력 ★정확히 0★): 섞어 재면 블록IC 0.0863 · t 5.41 → ★정식합류★.
      #   블록 안에서 시장 평균을 빼면(고정효과) 0.0056 · t 1.27 로 제자리를 찾는다.
      #   이 검사는 ① 사고 재현 ② 제거 확인 ③ ★진짜 실력은 안 깎임★ ④ 한 시장이면 무변화
      #   ⑤ 게이트에 값 대는 자리 전수 ⑥ ★파이썬 학습기와 숫자가 같은가★(변환정합성) 를 본다.
      - name: 시장 고정효과 IC 검사 (편향 재현 · 제거 · 과잉교정 금지 · 파이썬 동치)
        run: node tools/check-market-fixed-effect.mjs
      # [V33.292] 같은 구멍이 ★정확도 게이트★ 에도 있었다. 단타는 "합쳐 본 다수클래스+1.5%p",
      #   GBDT/DNN/MIND/SEQ 는 "고정 0.505" 를 요구했는데, 시장만 아는 예측기가 얻는 정확도는
      #   Σ_m (n_m/N)·max(기저_m, 1−기저_m) 이고 기저 US 0.55/KR 0.45 면 ★0.55★ 다 — 둘 다 넘는다.
      #   문턱 상수는 안 건드리고 ★기준점★ 만 '실력 없이 도달 가능한 정확도' 로 올린다.
      #   이 값은 상수 예측기가 얻는 값보다도 크거나 같아서 다수클래스 구멍도 함께 막힌다.
      - name: 무실력 정확도 기준점 검사 (시장전용·상수 예측기 차단 · 무해성 · 파이썬 동치)
        run: node tools/check-noskill-baseline.mjs
      # [V33.300] "블록 5개 미만이면 못 잰 것" 가드가 ★한 번도 발동한 적이 없었다★.
      #   주석은 "블록(=서로 다른 날)" 이라는데 실제로 센 값은 슬라이스 개수이고,
      #   k = max(5, min(12, n/200)) 이라 언제나 5 이상 — 도달 불가능한 죽은 코드였다.
      #   라벨 지평이 10일인데 MEMO 홀드아웃은 13일이다: 겹치지 않는 관측이 ★1개★ 인데
      #   12조각으로 잘라 t 를 냈다. 그 t 가 잰 것은 실력이 아니라 그 2주의 시장 방향이다.
      #   문턱은 안 건드리고 ★세는 대상★ 만 달력기간÷라벨지평 으로 되돌린다.
      - name: 홀드아웃 검정력 검사 (죽은 가드 증명 · 못쟀다/못미쳤다 구분 · 무해성 · 호환)
        run: node tools/check-holdout-power.mjs
      # [V33.275] 단타 표본 6.7만 건이 폭 불일치로 버려지고 있었다(Modal 실측: 표본 16건).
      #   달력 6칸은 날짜만으로 되살릴 수 있어 복원한다 — 되살리기는 조용히 오염되기 가장
      #   쉬운 종류라, 복원값이 ★라이브 조립과 오차 0★ 인지와, 날짜로 못 만드는 것(65칸·
      #   ts 결측)은 ★안 만드는지★ 를 함께 본다. 파이썬이 달력을 재구현하면 실패시킨다.
      - name: 달력 소급복원 검사 (라이브 동일값 · 기권 조건 · 단일 구현)
        run: node tools/check-cal-backfill.mjs
      # cloudflare/wrangler-action 대신 로컬에서 검증된 방식 그대로 실행
      # (wrangler-action@v3의 npx 자동설치가 4.86.0을 요구하며 실패하던 문제 회피)
      - name: Install wrangler
        if: github.event_name == 'push'   # [V33.307] PR 에서는 배포하지 않는다(검사만)
        run: npm install -g wrangler@4.100.0
      # [V33.15] 대형모델(DNN 32MB) 전용 R2 버킷을 자동으로 준비한다 — 수동 작업 0.
      #   버킷이 실제로 존재하는 것을 확인했을 때만 wrangler.toml 의 바인딩 주석을 푼다(러너 안에서만).
      #   토큰에 R2 권한이 없거나 R2 미활성 계정이면 ok=false 로 떨어진다. 대형모델은 D1 청크로
      #   폴백하지만(그 경로는 실제로 동작한다), ★장중 표본 수집은 V33.110 부터 중단된다★.
      - name: Prepare R2 bucket for big models
        if: github.event_name == 'push'   # [V33.307] PR 에서는 배포하지 않는다(검사만)
        id: r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "::group::wrangler r2 bucket create"
          wrangler r2 bucket create ai-trader-models 2>&1 | tee /tmp/r2create.txt
          echo "::endgroup::"
          # [V33.96] 존재 확인을 두 가지 방식으로 한다.
          #   종전엔 `bucket list | grep` 하나에만 의존했는데, wrangler 4.x 는 출력 형식이
          #   버전마다 달라(테이블/JSON) grep 이 빗나가면 '버킷은 있는데 없다고 판정' 된다.
          #   그러면 조용히 D1 경로로 배포되고, 왜 R2 가 안 붙었는지 아무 단서가 안 남는다.
          FOUND=0
          echo "::group::wrangler r2 bucket list"
          wrangler r2 bucket list --json 2>/dev/null | tee /tmp/r2list.json
          wrangler r2 bucket list 2>&1 | tee /tmp/r2list.txt
          echo "::endgroup::"
          grep -q 'ai-trader-models' /tmp/r2list.json 2>/dev/null && FOUND=1
          grep -q 'ai-trader-models' /tmp/r2list.txt  2>/dev/null && FOUND=1
          # create 가 "already exists" 로 실패한 경우도 존재로 친다.
          grep -qi 'already exists\|already owned' /tmp/r2create.txt 2>/dev/null && FOUND=1
          # create 가 성공했으면 당연히 존재.
          grep -qi 'created bucket\|Success' /tmp/r2create.txt 2>/dev/null && FOUND=1
          if [ "$FOUND" = "1" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ R2 버킷 확인됨 — 대형모델·장중 표본을 R2 로 저장한다."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ R2 사용 불가 — D1 경로로 진행한다(서비스 영향 없음)."
            echo "   원인 후보: ① API 토큰에 'Workers R2 Storage: Edit' 권한 없음"
            echo "              ② 계정에 R2 미활성(대시보드에서 R2 활성화 필요)"
            echo "   위 [create]/[list] 원문 출력을 보면 어느 쪽인지 바로 나온다."
          fi
          exit 0
      - name: Enable R2 binding
        # [V33.307] 기존 조건과 ★합쳐서★ 건다 — if 를 두 줄 쓰면 YAML 중복 키가 되어
        #   뒤엣것이 이기고 push 가드가 조용히 죽는다(PR 이 배포한다).
        if: github.event_name == 'push' && steps.r2.outputs.ok == 'true'
        run: |
          set -e
          sed -i \
            -e 's/^# \[\[r2_buckets\]\]$/[[r2_buckets]]/' \
            -e 's/^# binding = "MODELS"$/binding = "MODELS"/' \
            -e 's/^# bucket_name = "ai-trader-models"$/bucket_name = "ai-trader-models"/' \
            wrangler.toml
          echo '--- wrangler.toml (r2 구간) ---'
          grep -A2 '^\[\[r2_buckets\]\]' wrangler.toml
          # [V33.96] sed 가 실제로 먹었는지 확인한다 — 주석 형식이 조금만 바뀌어도
          #   패턴이 빗나가 '켰다고 생각했는데 안 켜진' 상태로 배포된다(지금까지가 그 상태일 수 있다).
          grep -q '^\[\[r2_buckets\]\]' wrangler.toml || {
            echo "::error::R2 바인딩 주석 해제 실패 — wrangler.toml 의 주석 형식이 sed 패턴과 다르다."
            exit 1
          }
          grep -q '^binding = "MODELS"' wrangler.toml || { echo "::error::binding 줄 해제 실패"; exit 1; }
          grep -q '^bucket_name = "ai-trader-models"' wrangler.toml || { echo "::error::bucket_name 줄 해제 실패"; exit 1; }
          echo "✅ R2 바인딩 활성화 확인"
      - name: R2 status summary
        if: always() && github.event_name == 'push'   # [V33.307] 위와 같은 이유로 합쳐서 건다
        run: |
          if grep -q '^\[\[r2_buckets\]\]' wrangler.toml; then
            echo "### ✅ R2 바인딩 활성 — 장중 표본이 R2 경로로 쌓인다" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔴 R2 바인딩 비활성 — 장중 표본 수집이 ★중단★ 된다" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "V33.110 에서 D1 폴백을 제거했다(틀린 진단 위에 지은 코드였고 한 번도 실행된 적이 없다)." >> "$GITHUB_STEP_SUMMARY"
            echo "이제 R2 가 없으면 조용히 우회하지 않고 멈춘다 — 워커 로그에 ERROR 로 남는다." >> "$GITHUB_STEP_SUMMARY"
            echo "R2 를 켜려면 CLOUDFLARE_API_TOKEN 에 **Workers R2 Storage: Edit** 권한을 주고," >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare 대시보드에서 R2 를 활성화한 뒤 다시 push 하면 자동으로 붙는다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy
        if: github.event_name == 'push'   # [V33.307] PR 에서는 배포하지 않는다(검사만)
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
