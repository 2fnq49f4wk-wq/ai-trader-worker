name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 배포 전 안전게이트 — 깨진 코드 push 시 구문오류면 배포 차단(라이브 보호)
      - name: Syntax check
        run: node --check src/index.js
      # cloudflare/wrangler-action 대신 로컬에서 검증된 방식 그대로 실행
      # (wrangler-action@v3의 npx 자동설치가 4.86.0을 요구하며 실패하던 문제 회피)
      - name: Install wrangler
        run: npm install -g wrangler@4.100.0
      - name: Deploy
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
