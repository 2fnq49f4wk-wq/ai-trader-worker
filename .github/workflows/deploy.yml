        run: node tools/check-stack-oof.mjs
      # [V33.209] STACK 은 위원회 결합확률을 통째로 대체하는 자리인데 결합기가 선형이었다 —
      #   "전문가마다 고정 가중치" 밖에 표현 못 한다. 조건부 신뢰("MIND 는 GBDT 도 강할 때만 맞는다"),
      #   마스크 상호작용, 과신 구간의 비단조 반응은 전부 상호작용 항이라 원리상 못 잡는다.
      #   그래서 GBDT·MLP 헤드를 후보로 세웠다. 다만 후보를 여럿 재고 최고를 고르는 순간
      #   ①홀드아웃 조기종료 ②K개 최댓값에 단일검정 문턱 ③학습/채점 좌표 불일치 로 무너질 수 있다.
      #   이 게이트가 그 셋을 막고, XOR 재현으로 "비선형이 실제로 학습되는지" 까지 잰다.
      - name: 메타 비선형 헤드 계약 검사 (홀드아웃 불가침 · 다중검정 · 재현성 · XOR 재현)
        run: node tools/check-meta-heads.mjs
      # [V33.207] 이 저장소의 모델 장애 상당수는 알고리즘이 아니라 ★산식★ 에서 났다:
