name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # [V33.99] ★구문 게이트 재작성★ — 종전 `node --check src/index.js` 는 무력했다.
      #   Node 22 의 --check 는 `export` 가 있는 .js 파일의 구문오류를 삼킨다(2줄로 재현됨).
      #   그 결과 V33.82 의 중괄호 누락이 통과했고 ★배포가 17커밋 연속 실패★ 했는데
      #   게이트는 매번 "통과" 라고 했다. 이제 .mjs 모듈 파싱 + esbuild(wrangler 와 동일 파서)
      #   + 독립 중괄호 균형 검사를 함께 돌린다.
      - name: Install esbuild (구문 게이트용 — wrangler 와 동일 파서)
        run: npm install --no-save esbuild@0.28.1
      - name: Syntax check
        run: node tools/check-syntax.mjs src/index.js
      # [V33.61] 프론트(public/index.html)의 인라인 <script> 도 반드시 검사한다.
      #   위 검사는 src/index.js 만 본다 — 실제로 V33.60 에서 HTML 인라인 스크립트의
      #   중괄호가 어긋나 우측 사이드바·AI두뇌 창이 통째로 죽었는데 게이트를 그대로 통과했다.
      - name: Frontend inline script check
        run: node tools/check-html-js.mjs
      # [V33.84] 선언·사용 순서 계약 — node --check 가 못 잡는 TDZ 를 막는다.
      #   실제로 V33.83 켈리 블록이 stopDist 선언보다 앞에 놓여 매 진입마다 ReferenceError 가
      #   났고, 자기 try/catch 에 삼켜져 '기능이 있는데 전혀 안 도는' 상태로 배포됐다.
      - name: Declaration order contract check
        run: node tools/check-order.mjs
      # [V33.103] 단타 표본 파이프라인 오프라인 재현 — 실제 코드를 합성 5분봉으로 돌린다.
      #   "표본 0건" 이 V33.40 이후 반복됐고, 원인은 매번 달랐다(스코프 사고·피처 null·플러시 조건).
      #   프로덕션 로그로 추적하는 대신 CI 에서 표본이 실제로 나오는지 매 배포마다 확인한다.
      - name: Scalp sample pipeline check
        run: node tools/check-scalp-pipeline.mjs
      # [V33.105] 확률 계수 적합기 — 참값을 아는 합성자료로 되찾아지는지 확인한다.
      #   이 프로젝트의 확률 사고는 전부 "식은 그럴듯한데 안 맞는" 형태였다. 식을 눈으로
      #   검토하는 대신 회복력을 직접 잰다(과대적용·적정·소표본잡음·강효과 4케이스).
      - name: Probability coefficient fitter check
        run: node tools/check-prob-fitters.mjs
      # [V33.107] 회계 불변식 — 체결식과 원장 재생식이 어긋나면 현금이 조용히 표류한다.
      #   실제로 두 달을 쫓았던 사고라, 식을 손으로 다시 적어 계약으로 못 박는다.
      - name: Accounting invariant check
        run: node tools/check-accounting.mjs
      # [V33.108] LangGraph 식 파이프라인 그래프 — 야간 34단계의 순서 근거가 전부 주석이었다.
      #   코드에서 getState/setState 채널을 추출해 의존 그래프를 만들고, 실행순서가 그걸
      #   거스르지 않는지 검사한다(의도된 역방향만 명시적으로 허용). 주석은 실행되지 않는다.
      - name: Pipeline graph (LangGraph-style) check
        run: node tools/check-pipeline-graph.mjs
      # [V33.108] 재무제표 툴킷 — 부호 하나만 뒤집혀도 '우량'과 '위험'이 바뀐다.
      #   답을 아는 합성 재무제표로 각 툴이 그 답을 되찾는지 확인한다.
      - name: Financial statement toolkit check
        run: node tools/check-fin-tools.mjs
      # [V33.109] "주석으로만 존재하는 설정" — DEFAULT_CFG 492개 중 82개를 코드가 안 읽고 있었다.
      #   화면에서 바꿔도 아무 일이 없는 손잡이는 없는 것보다 나쁘다("설정했으니 그렇게 돌겠지").
      #   읽히거나(WIRED) 사유와 함께 은퇴하거나(RETIRED) — 둘 다 아닌 키가 새로 생기면 차단한다.
      - name: Dead config check
        run: node tools/check-dead-config.mjs
      # [V33.110] 소셜 최신성 계약 — 반감기 상수 하나가 잘못 들어가도 결과는 여전히
      #   '그럴듯한 점수'로 나온다. 시각을 아는 합성 스트림으로 계약을 못 박는다.
      - name: Social freshness contract check
        run: node tools/check-social.mjs
      # [V33.111] 외부 AI API 금지 정책을 기계가 강제한다. 스위치는 지워질 수 있고
      #   새 호출은 스위치 없이 추가될 수 있다 — 실제로 /api/rf-test 가 인증 없이
      #   Roboflow API 키를 5개 외부 호스트로 보내고 있었다(이번에 삭제).
      - name: No external AI policy check
        run: node tools/check-no-external-ai.mjs
      # [V33.115] 표본 고유도 — 워커와 Modal 트레이너가 ★같은 자★ 로 재는지 확인한다.
      #   V33.114 직후가 실제로 어긋난 상태였다: 워커 자체학습만 유효표본수로 하한을 재고
      #   외부 업로드(DNN·GBDT·MIND·단타)는 명목 n 이라, 같은 성적이어도 외부 모델만 승격됐다.
      #   실제 파이썬 함수 본문을 실행해 워커 결과와 원소별로 비교한다(재구현 비교 아님).
      - name: Sample uniqueness contract check
        run: node tools/check-uniqueness.mjs
      # [V33.116] 원장 판정의 유의성 — 모델 검증엔 t·본페로니를 깔아놓고 정작 ★실제 돈이
      #   걸린★ 자동차단(신호·전략·시장×전략·자가평가)은 맨 문턱이었다. 이항분포로 실측하면
      #   공정한 전략도 n=40·WR<42% 조건에 26.8% 확률로 걸린다 — 사실상 언젠가 전부 꺼졌다.
      #   몬테카를로로 오차단률과 검정력을 매 배포마다 함께 잰다(둘 중 하나만 좋으면 실패).
      - name: Ledger edge significance check
        run: node tools/check-edge-stats.mjs
      # [V33.119] 레버리지 결정기 — 여기가 틀리면 손실이 그대로 배가된다.
      #   Freqtrade leverage() 콜백 구조로 한곳에 모으고, 규칙은 AQR 변동성 타게팅 +
      #   Passivbot 노출 테이퍼 + 효율비(ER) 문지기다. 답을 아는 합성입력으로 계약을 못 박는다.
      - name: Leverage decision contract check
        run: node tools/check-leverage.mjs
      # [V33.131] 전략버킷 예산 가드 — "넘으면 버린다" 가 아니라 "넘으면 줄인다" 여야 한다.
      #   종전엔 한도를 넘는 주문을 통째로 버렸고, 다음 사이클이 같은 수량을 다시 제시하므로
      #   ★영원히 못 사는 교착★ 이 됐다(로그의 예산 차단 25건이 전부 누적=0 이었다).
      #   교착 해소와 한도 준수를 ★동시에★ 본다 — 하나만 보면 반대쪽으로 틀린다.
      - name: Budget bucket clamp contract check
        run: node tools/check-budget-clamp.mjs
      # [V33.135] AI 진입 문턱의 절대 하한 — 손익분기 확률에서 나와야 한다.
      #   이 값은 ★거래를 늘리는 방향★ 으로 바뀌었다. 문이 열리는 것과 닫혀 있는 것을
      #   함께 검사한다: 기대값 양수 구간은 통과하고, 음수 구간은 어떤 손익비에서도 못 지난다.
      - name: AI entry floor contract check
        run: node tools/check-entry-floor.mjs
      # [V33.138] 위원 자격 — 이분법(trusted)에서 '증거 비례' 로 바꿨다. 위원회에 모델을
      #   ★더 넣는★ 방향이므로 잡음 유입을 실측한다. 배수가 아니라 소프트맥스 ★지분★ 을 재고,
      #   전진 IC 가 음수인 모델은 어떤 홀드아웃 성적으로도 못 들어오는지 함께 확인한다.
      - name: Committee expert admission contract check
        run: node tools/check-expert-admit.mjs
      # [V33.140] 전진검증 누적 원장 — 창이 매일 밤 리셋돼 ★구조적으로★ 못 채워지던 것을 고쳤다.
      #   (memo: 총표본 177,868 인데 전진 357 = 어제 유입과 정확히 일치)
      #   교착 해소와 통계 정직성을 함께 본다: 잡음 통과율이 문턱의 명목값과 맞는지,
      #   음수 IC 가 누적으로 뒤집히지 않는지, 같은 모델 버전을 두 번 세지 않는지.
      - name: Forward validation ledger contract check
        run: node tools/check-fwd-ledger.mjs
      # [V33.141] 경계 퍼징 — 라벨 지평이 5일이라 경계 직전 학습표본의 결과 구간이
      #   검증 구간으로 뻗는다(de Prado purging). 넣되 ★효과를 과장하지 않는다★ —
      #   합성 측정에서 홀드아웃 변화는 0.0001 이었고, 운영의 10배 갭은 측정 버그가 아니라
      #   일반화 갭이다. 이 게이트는 "해롭지 않은가"와 "구현 방향이 맞는가"만 본다.
      - name: Train/val purge contract check
        run: node tools/check-purge.mjs

      - name: 목표가 개정 계약 검사 (상향/하향 · 부호 규약 · 가격 독립성)
        run: node tools/check-analyst-rev.mjs

      - name: XALPHA 계약 검사 (횡단면 랭크 · 누출 · 일별 유의성)
        run: node tools/check-xalpha.mjs
      # [V33.188] 확률 보정 — 운영에서 "51.4% 라고 말한 자리의 실제 승률 34.3%" 가 관측됐다.
      #   진입문턱이 바로 그 구간이라, 이 17%p 는 켈리·사이징·게이트로 그대로 흘러간다.
      #   온도보정은 0.5→0.5 를 고정하므로 치우침을 구조적으로 표현할 수 없다 — 가족을 넓혔다.
      #   이 게이트는 적용 경로가 하나인지, 가드가 cal.T 에 매여 베타 보정을 삼키지 않는지,
      #   단조성이 지켜지는지, 그리고 ★홀드아웃에서 실제로 온도를 이기는지★ 를 몬테카를로로 본다.
      - name: 확률 보정 계약 검사 (치우침 · 단조성 · 교차검증 선택)
        run: node tools/check-calibration.mjs
      # [V33.190] 남용 방어 · 다중 사용자. 이 워커에는 요청 한도가 하나도 없었고, 가장 비싼
      #   조회(/api/ai/selfcheck, 실측 5,976ms)는 캐시조차 없었다. D1 은 SQLite 한 인스턴스라
      #   거래 사이클과 같은 큐를 쓴다 — 화면이 느려지는 문제가 아니라 매매가 밀리는 문제다.
      #   이 게이트는 한도가 라우팅보다 먼저인지, 한도기가 저장소를 안 쓰는지(쓰면 그 자체가
      #   공격 도구다), 정상 부팅이 안 막히고 폭주는 막히는지를 ★모의 실행★ 으로 확인한다.
      - name: 남용 방어 · 다중 사용자 계약 검사
        run: node tools/check-abuse.mjs
      # [V33.191] 모델 증거 — "누가 어떤 근거로 표를 받는가" 와 "어디서 학습되는가".
      #   DNN 이 GPU 예산과 워커 예산을 같은 상수로 쓰다 한 번도 수렴 못 한 망을 매일 밤 만들었고
      #   (valAcc 0.404), 표본은 185,408건 중 5,000건만 그것도 최근 구간에서 봤다.
      #   한편 정확도 하한이 동전보다 낮은 부스터(XGB 0.4836)가 위원회에서 표를 던지고 있었다.
      - name: 모델 증거 계약 검사 (GPU/워커 분리 · 표본 대표성 · 위원 자격)
        run: node tools/check-model-evidence.mjs
      # [V33.156] 설치형(PWA) — 서비스워커는 이 저장소가 반복해서 겪은 ★낡은 화면★ 문제를
      #   증폭시키기 가장 쉬운 장치다. 그래서 문서와 API 는 네트워크 우선으로 못박고,
      #   캐시는 오프라인 폴백으로만 쓴다. 이 게이트는 그 순서를 코드에서 직접 읽어 확인한다.
      - name: PWA 계약 검사 (매니페스트 · 아이콘 · 네트워크 우선)
        run: node tools/check-pwa.mjs
      # [V33.156] 폰 화면 개편 — 아이패드·PC 는 "지금과 똑같이" 가 요구조건이었다.
      #   폰 규칙이 미디어쿼리 밖으로 한 줄만 새도 그 약속이 깨지고, 셸 여백과 바 높이가
      #   어긋나면 ★설치했을 때만★ 본문이 노치·홈바에 깔린다(웹에선 안 보인다).
      #   글벽을 접은 아코디언은 함수를 실제로 돌려 "접기이지 지우기가 아님"을 센다.
      - name: 폰 화면 계약 검사 (격리 · 안전영역 · 아코디언 무손실)
        run: node tools/check-mobile.mjs
      # [V33.159] 한국장 매매정지 — 사이드카 ±5/6%, 서킷브레이커 -8/-15/-20% 는
      #   한국거래소 규정이라 우리가 고를 수 있는 값이 아니다. 하나만 틀려도 화면이
      #   규정과 다른 말을 하고, 그걸 보고 판단하면 사람이 손해를 본다.
      #   구현을 흉내내지 않고 함수 원문을 떼어 실제로 돌려 확인한다.
      - name: 한국장 매매정지 계약 검사 (사이드카 · 서킷브레이커)
        run: node tools/check-kr-halt.mjs
      # [V33.162] 종목별 애널리스트 자료 — 요구는 하나였다: "추측 말고 발표난 걸로".
      #   그래서 검사도 하나다 — 화면에 나가는 숫자의 출처가 분명한가.
      #   못 받으면 비우는지, 출처를 늘 밝히는지, '발표 원문' 과 '우리 관측' 을
      #   섞지 않는지, 국내 종목 경로가 실제로 있는지.
      - name: 종목별 애널리스트 자료 계약 검사 (출처 · 발표/관측 구분)
        run: node tools/check-analyst-detail.mjs
      # [V33.163] 국내 증권사 리포트 파서 — 표의 열 순서를 우리가 정할 수 없고
      #   이 세션에서는 응답을 실측하지도 못했다. '몇 번째 칸' 이 아니라 생김새로 고르는데,
      #   그 규칙이 흔들리면 엉뚱한 숫자가 목표가로 올라간다. HTML 모양을 여러 개 만들어 돌린다.
      - name: 국내 증권사 리포트 파서 검사 (열 순서 무관 · 오인 방지)
        run: node tools/check-kr-broker.mjs
      # [V33.166] 국내 목표주가 추출 — 두 번 실패한 원인이 같았다: '표의 몇 번째 칸' 가정.
      #   구조를 버리고 '목표주가' 라는 말 뒤의 숫자를 찾는다. 여러 모양에서 통하는지와,
      #   무엇보다 ★아무 숫자나 줍지 않는지★ 를 본다(엉뚱한 값은 조용한 거짓말이 된다).
      - name: 국내 목표주가 추출 검사 (라벨 앵커 · 오인 방지)
        run: node tools/check-kr-consensus.mjs
      # [V33.169] 심화 재무분석 · 동일 업종 비교.
      #   업종 비교는 '상대 위치' 를 말한다 — 방향(높을수록 좋음/나쁨)을 한 번만 틀리면
      #   발생액이 높은 기업이 '업종 상위' 로 뜬다. 숫자는 그럴듯하고 뜻은 정반대다.
      #   산식은 손계산과 대조하고, 표본 부족·결측 처리·조회 비용까지 함께 본다.
      - name: 심화 재무분석·업종 비교 계약 검사 (산식 · 방향 · 표본)
        run: node tools/check-fund-peer.mjs
      # [V33.170] 사이클 상수 캐시 — 증상은 CPU/시간이었지만 원인은 D1 왕복이었다.
      #   mlDeepDecide 가 호출당 14회 읽는데 스캔 경로가 그 값을 안 넘겨 종목마다 다시 읽었다.
      #   호출부마다 opts 를 채우는 방식은 또 빠뜨릴 수 있어(실제로 그랬다) 읽기 자체를 기억한다.
      #   쓰기가 나면 즉시 잊는지(학습 결과를 옛 값으로 읽지 않는지)를 함께 확인한다.
      - name: 사이클 상수 캐시 계약 검사 (왕복 횟수 · 쓰기 무효화)
        run: node tools/check-cyc-memo.mjs
      # [V33.171] 라운드로빈 커버리지 — "전 종목을 도는가, 같은 종목만 도는가".
      #   형태트리거가 매 사이클 118~227종목을 승격시켰는데 예산으로 실제 평가되는 것은 6~62종목뿐이라
      #   순환 대기열에 한 번도 도달하지 못했다. 순환 진도가 늘 0이라 오프셋이 사이클당 한 칸씩만 갔다
      #   (557종목 한 바퀴 ≈ 9시간). 실제 소스를 떼어 여러 사이클을 모의해 완주를 확인한다.
      - name: 라운드로빈 커버리지 검사 (전 종목 완주 · 오프셋 전진)
        run: node tools/check-roundrobin.mjs
      # [V33.172] 평가 예산 총량 + 외부학습 커밋 가시성.
      #   평가 루프의 부가조회가 기능마다 자기 몫만 보고 늘어나(단타 35~45% + FLOW 무제한 +
      #   옵션 무제한) 사이클당 평가가 450종목 → 34종목으로 주저앉았다. 총량 지갑으로 막는다.
      #   커밋 500 이 8일간 조용했던 문제도 함께 — '보낸 시각'이 아니라 '들어온 결과'를 표시한다.
      - name: 평가비용·학습가시성 검사 (부가조회 총량 · 커밋 관측)
        run: node tools/check-eval-cost.mjs
      # [V33.173] 표본 시각 계약. 소급생성이 ts 에 적재 시각을 찍어, 몇 달치 시장이 하루로 뭉쳤다.
      #   퍼징이 그걸 전부 '검증 구간 침범'으로 보고 학습셋을 통째로 잘랐다
      #   (실측: XALPHA 표본 1,921 → 학습표본 0/800, FLOW 7,788 → 298/800).
      #   "표본은 다 모였는데 학습이 안 된다"의 정체다. 퍼징 식을 떼어 재현·검증한다.
      - name: 표본 시각 검사 (관측 시각 · 퍼징 생존율)
        run: node tools/check-sample-ts.mjs
      # [V33.176] 표본 전달 계약. R2 스냅샷 행에 s(종목)가 빠져 트레이너가 온 표본을 한 종목으로
      #   보고 고유도를 쟀다 — 유효표본 183,948 → 31건, Wilson 하한 24%, trustFloor 영구 미달.
      #   표본 부족처럼 보였지만 한 칸이 빠진 것이었다. 모든 내보내기 경로의 필드를 맞춰 검사한다.
      - name: 표본 전달 검사 (종목 필드 · 스냅샷 스키마 판)
        run: node tools/check-ml-export.mjs
      # cloudflare/wrangler-action 대신 로컬에서 검증된 방식 그대로 실행
      # (wrangler-action@v3의 npx 자동설치가 4.86.0을 요구하며 실패하던 문제 회피)
      - name: Install wrangler
        run: npm install -g wrangler@4.100.0
      # [V33.15] 대형모델(DNN 32MB) 전용 R2 버킷을 자동으로 준비한다 — 수동 작업 0.
      #   버킷이 실제로 존재하는 것을 확인했을 때만 wrangler.toml 의 바인딩 주석을 푼다(러너 안에서만).
      #   토큰에 R2 권한이 없거나 R2 미활성 계정이면 ok=false 로 떨어진다. 대형모델은 D1 청크로
      #   폴백하지만(그 경로는 실제로 동작한다), ★장중 표본 수집은 V33.110 부터 중단된다★.
      - name: Prepare R2 bucket for big models
        id: r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "::group::wrangler r2 bucket create"
          wrangler r2 bucket create ai-trader-models 2>&1 | tee /tmp/r2create.txt
          echo "::endgroup::"
          # [V33.96] 존재 확인을 두 가지 방식으로 한다.
          #   종전엔 `bucket list | grep` 하나에만 의존했는데, wrangler 4.x 는 출력 형식이
          #   버전마다 달라(테이블/JSON) grep 이 빗나가면 '버킷은 있는데 없다고 판정' 된다.
          #   그러면 조용히 D1 경로로 배포되고, 왜 R2 가 안 붙었는지 아무 단서가 안 남는다.
          FOUND=0
          echo "::group::wrangler r2 bucket list"
          wrangler r2 bucket list --json 2>/dev/null | tee /tmp/r2list.json
          wrangler r2 bucket list 2>&1 | tee /tmp/r2list.txt
          echo "::endgroup::"
          grep -q 'ai-trader-models' /tmp/r2list.json 2>/dev/null && FOUND=1
          grep -q 'ai-trader-models' /tmp/r2list.txt  2>/dev/null && FOUND=1
          # create 가 "already exists" 로 실패한 경우도 존재로 친다.
          grep -qi 'already exists\|already owned' /tmp/r2create.txt 2>/dev/null && FOUND=1
          # create 가 성공했으면 당연히 존재.
          grep -qi 'created bucket\|Success' /tmp/r2create.txt 2>/dev/null && FOUND=1
          if [ "$FOUND" = "1" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ R2 버킷 확인됨 — 대형모델·장중 표본을 R2 로 저장한다."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ R2 사용 불가 — D1 경로로 진행한다(서비스 영향 없음)."
            echo "   원인 후보: ① API 토큰에 'Workers R2 Storage: Edit' 권한 없음"
            echo "              ② 계정에 R2 미활성(대시보드에서 R2 활성화 필요)"
            echo "   위 [create]/[list] 원문 출력을 보면 어느 쪽인지 바로 나온다."
          fi
          exit 0
      - name: Enable R2 binding
        if: steps.r2.outputs.ok == 'true'
        run: |
          set -e
          sed -i \
            -e 's/^# \[\[r2_buckets\]\]$/[[r2_buckets]]/' \
            -e 's/^# binding = "MODELS"$/binding = "MODELS"/' \
            -e 's/^# bucket_name = "ai-trader-models"$/bucket_name = "ai-trader-models"/' \
            wrangler.toml
          echo '--- wrangler.toml (r2 구간) ---'
          grep -A2 '^\[\[r2_buckets\]\]' wrangler.toml
          # [V33.96] sed 가 실제로 먹었는지 확인한다 — 주석 형식이 조금만 바뀌어도
          #   패턴이 빗나가 '켰다고 생각했는데 안 켜진' 상태로 배포된다(지금까지가 그 상태일 수 있다).
          grep -q '^\[\[r2_buckets\]\]' wrangler.toml || {
            echo "::error::R2 바인딩 주석 해제 실패 — wrangler.toml 의 주석 형식이 sed 패턴과 다르다."
            exit 1
          }
          grep -q '^binding = "MODELS"' wrangler.toml || { echo "::error::binding 줄 해제 실패"; exit 1; }
          grep -q '^bucket_name = "ai-trader-models"' wrangler.toml || { echo "::error::bucket_name 줄 해제 실패"; exit 1; }
          echo "✅ R2 바인딩 활성화 확인"
      - name: R2 status summary
        if: always()
        run: |
          if grep -q '^\[\[r2_buckets\]\]' wrangler.toml; then
            echo "### ✅ R2 바인딩 활성 — 장중 표본이 R2 경로로 쌓인다" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔴 R2 바인딩 비활성 — 장중 표본 수집이 ★중단★ 된다" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "V33.110 에서 D1 폴백을 제거했다(틀린 진단 위에 지은 코드였고 한 번도 실행된 적이 없다)." >> "$GITHUB_STEP_SUMMARY"
            echo "이제 R2 가 없으면 조용히 우회하지 않고 멈춘다 — 워커 로그에 ERROR 로 남는다." >> "$GITHUB_STEP_SUMMARY"
            echo "R2 를 켜려면 CLOUDFLARE_API_TOKEN 에 **Workers R2 Storage: Edit** 권한을 주고," >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare 대시보드에서 R2 를 활성화한 뒤 다시 push 하면 자동으로 붙는다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
