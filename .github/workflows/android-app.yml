# [V33.678·679] 앱 진화 2단계 — Capacitor 안드로이드 시험판(debug APK). 화면 = 워커 사이트 그대로(원격 URL).
# 계정·서명 키 없이 휴대폰에 직접 설치해 시험. 비밀값 GOOGLE_SERVICES_JSON(Firebase)이 있으면 앱 푸시까지 켠 빌드.
name: Build Android App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-app.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 의존성
        run: npm install --no-audit --no-fund
      - name: 안드로이드 프로젝트 준비
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./scripts-prepare.sh
      - name: debug APK 빌드
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: 결과물
        uses: actions/upload-artifact@v4
        with:
          name: lux-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
