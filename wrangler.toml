name = "ai-trader-app"
main = "src/index.js"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ai-trader-db"
database_id = "77db8a94-9d85-473a-9f43-9659ee8374c0"

# [V33.13] 대형 모델(DNN 32MB 등) 전용 오브젝트 스토리지.
#   D1은 SQLite 한 인스턴스라 32MB blob 읽기/쓰기가 거래·표본 쿼리와 같은 큐를 써서
#   "D1 DB is overloaded"를 유발한다. R2로 옮기면 GET/PUT 1회로 끝나고 D1 큐를 안 건드린다.
#
# [V33.191] ★주석을 푼다 — 이게 풀려 있지 않아 장중 단타 표본 수집이 멈춰 있었다.★
#   운영 스냅샷(2026-08-22 11:39) 실측:
#     r2.bound = false        ← 지금 이 워커에는 MODELS 바인딩이 없다
#     r2.v     = { bound:true, total:2399, bytes:629,611,616,
#                  "단타 표본": 1,745파일, newest: 5.6시간 전 }   ← 버킷과 데이터는 실재한다
#     scalp.store = "R2 미바인딩 — 수집 중단", scalp.collect = false
#   즉 버킷에는 629MB·2,399객체가 들어 있는데(5.6시간 전까지 정상 기록) 지금은 연결이 끊겨
#   장중 표본이 한 건도 안 쌓인다. 그런데 단타 모델은 valAccLB 0.6196 vs 기저 0.5248 —
#   ★이 시스템에서 가장 성적이 좋은 모델★ 이다. 그 모델의 데이터 공급만 끊겨 있었다.
#
#   원인: 배포는 wrangler.toml 이 선언한 바인딩으로 워커를 통째로 교체한다. 대시보드에서
#   손으로 붙여 둔 바인딩이 있어도 다음 배포가 지운다. 여기 선언돼 있지 않으면 배포할 때마다
#   조용히 사라진다 — "어제는 됐는데" 가 반복되는 전형적인 모양이다.
#   ★설정은 코드에 있어야 한다.★ 여기 적어 두면 모든 배포가 같은 상태로 수렴한다.
#
#   버킷이 없으면 배포가 실패한다 — 그건 안전한 실패다(실패하면 지금 판이 그대로 산다).
[[r2_buckets]]
binding = "MODELS"
bucket_name = "ai-trader-models"

[triggers]
crons = ["*/1 * * * *"]

# [V4] 야간 AI 파이프라인(수확+7단 학습+보정)이 기본 CPU 30s를 넘을 수 있어 상향.
#   평시 사이클은 수 초라 영향 없음 — 한도는 상한일 뿐 과금은 실사용 기준.
[limits]
cpu_ms = 300000

[assets]
directory = "./public"
binding = "ASSETS"

# [V32.26] Cloudflare Workers AI — 플랫폼 내장 LLM(Anthropic/외부 3rd-party 아님).
#   수치는 내부 결정론 엔진이 계산하고, 문장화(NLG)만 이 온플랫폼 모델이 담당(그라운딩→환각 방지).
[ai]
binding = "AI"

# === AI Gateway 경유 LLM 호출 ===
# 배포해도 안 지워지도록 여기에 박아둠.
# 끝이 /anthropic/v1/messages 형식이어야 코드와 맞음 (compat/chat/completions 아님)
[vars]
LLM_BASE_URL = "https://gateway.ai.cloudflare.com/v1/f146c5daff47728653b1e30b52c961af/trader1/anthropic/v1/messages"
